{id:"adeg",name:"程度補語",short:"程度",color:"var(--c-degree)",tint:"var(--c-degree-tint)",cards:[{"h": "不行", "p": "bùxíng", "ja": {"m": "限界に達している、どうにもならない", "i": "「行」（うまくいく、大丈夫）を「不」で全否定し、身体や感情がもう機能しない極限状態を表す"}, "en": {"m": "at one's limit, can't take it anymore", "i": "negates 行 (\"to be OK, to manage\") entirely, showing the body or emotion has hit a breaking point"}, "ex": "他熬夜趕稿三天，現在整個人累得不行。"}, {"h": "得要命", "p": "dé yàomìng", "ja": {"m": "死ぬほど〜だ、たまらなく〜だ", "i": "「要命」（命に関わる）を誇張して用い、程度が命がけと言えるほど激しいことを表す"}, "en": {"m": "unbearably, to a killing degree", "i": "exaggerates with 要命 (\"it could cost your life\") to show the degree is so intense it feels life-threatening"}, "ex": "今天的天氣熱得要命，走幾步就滿身是汗。"}, {"h": "得要死", "p": "dé yàosǐ", "ja": {"m": "死ぬほど〜だ（より生々しい口語）", "i": "「要死」（死にそうだ）を直接的に用い、「得要命」よりもさらに生々しく誇張した口語表現"}, "en": {"m": "to death, insanely (blunter than 得要命)", "i": "uses 要死 (\"about to die\") even more bluntly than 得要命, for a rawer, more colloquial exaggeration"}, "ex": "這道菜辣得要死，我一口就被嗆到咳嗽。"}, {"h": "之極", "p": "zhī jí", "ja": {"m": "〜の極み、この上なく〜だ", "i": "「極」（頂点）を「之」でつなぎ、状態がこれ以上ない極限点に達したことを書き言葉で示す"}, "en": {"m": "to the utmost, the very extreme of", "i": "links 極 (\"the peak\") with 之 to state, in formal register, that a condition has reached its outermost limit"}, "ex": "這種行徑荒謬之極，令人難以置信。"}, {"h": "至深", "p": "zhìshēn", "ja": {"m": "極めて深い（感情・影響について）", "i": "「至」（この上なく至る）が「深」を強調し、感情や影響が心の奥底まで達した深さを表す"}, "en": {"m": "profoundly deep (of feelings or influence)", "i": "至 (\"reaching the utmost\") intensifies 深 (\"deep\") to show an emotion or influence has sunk all the way to the core"}, "ex": "這部電影對他的影響至深，徹底改變了他的人生方向。"}, {"h": "無比", "p": "wúbǐ", "ja": {"m": "比類なく〜だ、この上なく〜だ", "i": "「無」＋「比」（比べるもの）で、比較対象が存在しないほど程度が高いことを論理的に示す"}, "en": {"m": "incomparably, unmatched in degree", "i": "literally \"without comparison\" — it logically asserts the degree is so high that nothing exists to measure it against"}, "ex": "這場演出精彩無比，全場觀眾起立鼓掌。"}, {"h": "得體", "p": "détǐ", "ja": {"m": "（言動が）非常にTPOに合っている、適切だ", "i": "「體」（体裁・規範）を「得」（獲得する）ことで、振る舞いが場の規範にぴったり収まった結果を表す"}, "en": {"m": "appropriately, fittingly (of behavior or speech)", "i": "得 (\"having attained\") + 體 (\"proper form\") shows behavior has landed exactly within the social norms of the situation"}, "ex": "她在酒會上應對得體，展現出成熟的社交手腕。"}, {"h": "入微", "p": "rùwēi", "ja": {"m": "微細な点まで行き届いている", "i": "「入」（入り込む）が「微」（微小なもの）にまで到達し、観察や配慮が極めて細かい所まで届く結果を表す"}, "en": {"m": "down to the finest detail", "i": "入 (\"entering into\") reaches all the way to 微 (\"the minute\"), showing observation or care extends to the tiniest particular"}, "ex": "這位護理師照顧病人體貼入微，深受家屬感激。"}, {"h": "到位", "p": "dàowèi", "ja": {"m": "（分析・仕事が）的確で完璧だ、ツボを押さえている", "i": "「到」（到達する）が「位」（あるべき位置）にきっちり着地し、物事が過不足なく適切に処理された結果を表す"}, "en": {"m": "precisely on point, executed just right", "i": "到 (\"arriving\") lands exactly at 位 (\"the right position\") — nothing under- or over-done, hitting the mark exactly"}, "ex": "他這次的分析非常到位，一針見血地指出問題核心。"}, {"h": "有加", "p": "yǒujiā", "ja": {"m": "さらに程度を加えて〜する（主に肯定的評価）", "i": "「加」（加える）を「有」で述べ、すでに高い評価や愛情にさらに上乗せしていく累加のニュアンスを表す"}, "en": {"m": "increasingly so, all the more (usu. positive)", "i": "有 + 加 (\"having addition\") frames the degree as piling on top of an already high baseline, ever more so"}, "ex": "主管對這位新人讚賞有加，認為她前途無量。"}, {"h": "透頂", "p": "tòudǐng", "ja": {"m": "極限に達している（主にネガティブ）", "i": "「透」（突き抜ける）が「頂」（頂点）にまで達し、悪い状態が振り切れるほど極まったことを表す"}, "en": {"m": "to the utmost degree (usu. negative)", "i": "透 (\"piercing through\") reaches all the way to 頂 (\"the very top\"), marking a negative state as completely maxed out"}, "ex": "他這種說謊成性的行為，簡直卑劣透頂。"}, {"h": "出奇", "p": "chūqí", "ja": {"m": "並外れて〜だ、驚くほど〜だ", "i": "「奇」（予想外）が「出」で表に現れ、予測を裏切るほど際立った程度であることを示す"}, "en": {"m": "unusually, surprisingly so", "i": "奇 (\"the unexpected\") emerges (出) beyond what one predicted, marking a degree that catches you off guard"}, "ex": "深夜的街道安靜得出奇，一個人影也沒有。"}, {"h": "不可開交", "p": "bùkě kāijiāo", "ja": {"m": "手が離せないほど忙しい、収拾がつかない", "i": "「開交」（決着をつけて手を離す）が「不可」で否定され、事態が絡み合って抜け出せない極度の状態を表す"}, "en": {"m": "too tied up to break free, in an unmanageable frenzy", "i": "開交 (\"to settle and disengage\") is negated by 不可 — things are so tangled you simply cannot pull yourself free"}, "ex": "年終結算期間，會計部忙得不可開交。"}, {"h": "驚恐萬狀", "p": "jīngkǒng wànzhuàng", "ja": {"m": "この上なく恐怖している様子", "i": "「驚恐」（恐れおののく）に「萬狀」（一万通りの様相）を添え、恐怖が数え切れないほど多様な形で表れる程度を誇張する"}, "en": {"m": "utterly terror-stricken, panicked in every visible way", "i": "萬狀 (\"ten thousand manifestations\") piles onto 驚恐 (\"terrified\") to exaggerate just how many ways the fear shows on the body"}, "ex": "聽到爆炸聲，附近居民驚恐萬狀，四處逃竄。"}, {"h": "分明", "p": "fēnmíng", "ja": {"m": "非常にくっきりと分かれている、明確だ", "i": "「分」（分ける）＋「明」（明らか）で、境界や区別が曖昧さなくはっきり分かれた結果を表す"}, "en": {"m": "sharply distinct, unmistakably clear", "i": "分 (\"dividing\") + 明 (\"clear\") shows a boundary or distinction has come out with zero ambiguity"}, "ex": "這位主管向來公私分明，從不假公濟私。"}, {"h": "得當", "p": "dédàng", "ja": {"m": "極めて適正だ、ちょうどよい", "i": "「當」（適切さ）を「得」（獲得する）ことで、処置や配置が過不足なくぴったり妥当である結果を表す"}, "en": {"m": "fittingly, exactly right (of handling or arrangement)", "i": "得 (\"attaining\") + 當 (\"what is fitting\") shows a decision landed exactly where it should, neither too much nor too little"}, "ex": "這次危機處理得當，公司損失降到了最低。"}, {"h": "過頭", "p": "guòtóu", "ja": {"m": "度を越している、やりすぎだ", "i": "基準の「頭」（先端）を「過」（通り過ぎる）ことで、適正な範囲をオーバーしてしまった結果を表す"}, "en": {"m": "overdoing it, going too far", "i": "過 (\"passing beyond\") + 頭 (\"the tip/limit\") pictures the action shooting right past the proper mark"}, "ex": "他這次玩笑開得過頭了，惹得對方非常不悅。"}, {"h": "成性", "p": "chéngxìng", "ja": {"m": "（悪癖などが）骨の髄まで染みついて習性になっている", "i": "行為が繰り返されて「性」（生まれつきの本性）にまで「成」（成ってしまう）ほど根深い習慣化を表す"}, "en": {"m": "to have become second nature (usu. of bad habits)", "i": "成 (\"becoming\") + 性 (\"one's inborn nature\") shows a repeated behavior has fused into the person's very disposition"}, "ex": "他說謊成性，身邊的朋友都不再相信他了。"}, {"h": "入骨", "p": "rùgǔ", "ja": {"m": "骨の髄まで〜だ、徹底的に〜だ", "i": "「入」（入り込む）が皮膚を突き抜けて「骨」（骨髄）にまで達するイメージで、感情の深さを誇張する"}, "en": {"m": "to the bone, penetratingly deep (of emotion)", "i": "入 (\"entering\") pushes past the skin all the way into 骨 (\"the bone\"), an image for an emotion sunk in devastatingly deep"}, "ex": "他對背信的舊友恨之入骨，多年仍無法釋懷。"}, {"h": "無以復加", "p": "wúyǐ fùjiā", "ja": {"m": "これ以上加えようがない、極限に達している", "i": "「無以」（〜する術がない）と「復加」（さらに加える）が結びつき、程度がすでに頂点に達しそれ以上増やしようがないことを示す"}, "en": {"m": "to the point nothing more could be added, utterly extreme", "i": "無以 (\"no way to\") + 復加 (\"add further\") states the degree has already peaked — there is literally no room left to add more"}, "ex": "這起貪汙案的荒謬程度已經到了無以復加的地步。"}],intro:{"zh": "表示動作或狀態達到的高階程度，比基礎程度補語更書面、更誇張。", "ja": "動作や状態が達した「程度」を、より書き言葉的・誇張的に表します。", "en": "Expresses an advanced degree an action or state reaches — more literary or exaggerated than the basic degree complements."}},
{id:"ares",name:"結果補語",short:"結果",color:"var(--c-result)",tint:"var(--c-result-tint)",cards:[{"h": "達成", "p": "dáchéng", "ja": {"m": "（合意・目標に）到達し成立させる", "i": "「達」（到達する）が「成」（成し遂げる）と結びつき、交渉や努力が実を結んで完成した結果を表す"}, "en": {"m": "to reach, to achieve (an agreement or goal)", "i": "達 (\"arriving at\") joins 成 (\"accomplishing\") to show effort or negotiation has landed in a completed, realized outcome"}, "ex": "經過數輪磋商，雙方終於達成共識。"}, {"h": "落空", "p": "luòkōng", "ja": {"m": "（期待・計画が）水の泡になる", "i": "「落」（落ちる）が「空」（何もない）という結果に至り、期待していたものが実現せず空振りに終わる様子を表す"}, "en": {"m": "to fall through, to come to nothing", "i": "落 (\"falling\") lands right in 空 (\"emptiness\") — the expectation or plan drops through into nothing at all"}, "ex": "因為天氣驟變，登頂的計畫最終落空了。"}, {"h": "見底", "p": "jiàndǐ", "ja": {"m": "底が見える、底をつく", "i": "「見」（見える）が「底」（底の部分）にまで達し、中身が使い果たされて底が露出する結果を表す"}, "en": {"m": "to hit bottom, to be nearly depleted", "i": "見 (\"becoming visible\") reaches all the way down to 底 (\"the bottom\") — the contents have run so low the bottom itself shows"}, "ex": "連日的乾旱讓水庫的水位幾乎見底。"}, {"h": "用盡", "p": "yòngjìn", "ja": {"m": "完全に使い果たす", "i": "「用」（使う）の結果が「盡」（尽きる）に至り、残りが一切なくなるまで消費し切ったことを表す"}, "en": {"m": "to use up entirely, to exhaust completely", "i": "用 (\"using\") runs its course all the way to 盡 (\"exhausted\") — nothing whatsoever is left after the using"}, "ex": "他用盡了所有積蓄，只為了完成這趟旅行。"}, {"h": "定格", "p": "dìnggé", "ja": {"m": "（瞬間・記憶に）固定される、定着する", "i": "「定」（固定する）が「格」（コマ・枠）に作用し、動いていた場面が一瞬のまま静止して固まる結果を表す"}, "en": {"m": "to freeze in place, to be fixed as a single still frame", "i": "定 (\"fixing\") acts on 格 (\"a frame\") — a moving moment is stopped dead and locked into one still image"}, "ex": "那張笑容燦爛的照片，永遠定格在他的記憶裡。"}, {"h": "歸公", "p": "guīgōng", "ja": {"m": "公のものに帰属する", "i": "「歸」（帰属する）の結果が「公」（公共）に落ち着き、私有物が公共の所有へと移る結末を表す"}, "en": {"m": "to be turned over to the public or state", "i": "歸 (\"reverting to\") settles onto 公 (\"the public\") — private gains end up handed over into public ownership"}, "ex": "這筆不義之財最終依法沒收歸公。"}, {"h": "化為", "p": "huàwéi", "ja": {"m": "〜に化す、跡形もなく姿を変える", "i": "「化」（変化する）の結果が「為」（〜になる）で示され、元の姿が跡形もなく別のものへ変貌する結末を表す"}, "en": {"m": "to turn into, to be reduced to", "i": "化 (\"transforming\") resolves into 為 (\"becoming\") — the original form dissolves entirely into something else"}, "ex": "一場大火過後，這棟老宅已化為灰燼。"}, {"h": "變為", "p": "biànwéi", "ja": {"m": "〜に変わる、〜になる", "i": "「變」（変わる）の結果が「為」で確定され、状態や性質が別のものへと移行し切ったことを表す"}, "en": {"m": "to change into, to become", "i": "變 (\"changing\") settles into 為 (\"becoming\") — a state or nature has shifted all the way into something different"}, "ex": "這篇報導的內容逐漸變為一場政治風波。"}, {"h": "看透", "p": "kàntòu", "ja": {"m": "（本質を）見抜く、見極める", "i": "「看」（見る）が「透」（突き抜ける）にまで至り、表面を貫いて本質や裏側まで見通す結果を表す"}, "en": {"m": "to see right through, to fully perceive the truth of", "i": "看 (\"looking\") pierces all the way through (透), letting the eye penetrate the surface down to the truth beneath"}, "ex": "共事多年，她早已看透了同事的真面目。"}, {"h": "看清", "p": "kànqīng", "ja": {"m": "はっきりと見て取る、見極める", "i": "「看」の結果が「清」（明瞭）に至り、曖昧だったものが視覚的にくっきり判別できるようになる結果を表す"}, "en": {"m": "to see clearly, to make out distinctly", "i": "看 (\"looking\") arrives at 清 (\"clarity\") — what was blurry resolves into something distinctly recognizable"}, "ex": "經過這件事，他終於看清了對方的本性。"}, {"h": "傷及", "p": "shāngjí", "ja": {"m": "（危害が）〜にまで及ぶ、傷つける", "i": "「傷」（傷つける）の作用が「及」（及ぶ）によって、本来無関係だった対象にまで被害が届いてしまう結果を表す"}, "en": {"m": "to injure, with the harm reaching (someone/something)", "i": "傷 (\"harming\") extends via 及 (\"reaching\") — the damage stretches out far enough to touch even bystanders"}, "ex": "這場車禍波及行人，不幸傷及一名孩童。"}, {"h": "波及到", "p": "bōjí dào", "ja": {"m": "（影響が）〜にまで広がり及ぶ", "i": "「波及」（波のように広がり及ぶ）に「到」（到達する）を添え、影響範囲が具体的な対象へ届いたことを明示する"}, "en": {"m": "to spread and reach, to extend as far as", "i": "波及 (\"rippling outward like waves\") is anchored by 到 (\"arriving at\") to pin down exactly where the ripple ends up"}, "ex": "這場金融風暴迅速波及到周邊多個國家。"}, {"h": "歸結為", "p": "guījié wéi", "ja": {"m": "（原因・結論を）〜に帰着させる", "i": "「歸結」（まとめて落ち着かせる）が「為」で着地点を示し、複雑な事象を一つの結論へと収束させる結果を表す"}, "en": {"m": "to boil down to, to come down to (a conclusion)", "i": "歸結 (\"converging to a settled point\") lands via 為 (\"as/into\") — complexity collapses down into a single conclusion"}, "ex": "這場爭議最終可以歸結為資源分配不公。"}, {"h": "致力於", "p": "zhìlì yú", "ja": {"m": "〜に尽力する、力を注ぎ込む", "i": "「致」（尽くす）「力」（力）の結果が「於」でその対象に向けて固定され、努力が特定の目標に注ぎ続けられることを表す"}, "en": {"m": "to devote oneself to, to be dedicated to", "i": "致力 (\"exerting all one's strength\") is pinned by 於 (\"at/toward\") onto its target — effort is channeled and fixed on one cause"}, "ex": "她畢生致力於偏鄉教育的推廣工作。"}, {"h": "凌駕於……之上", "p": "língjià yú...zhī shàng", "ja": {"m": "〜の上に君臨する、〜を凌駕する", "i": "「凌駕」（乗り越えて上に立つ）の結果が「於……之上」でその基準や対象の上方に固定される位置関係を表す"}, "en": {"m": "to override, to place oneself above (a standard or authority)", "i": "凌駕 (\"rising above and overtaking\") is fixed by 於……之上 (\"at a position above X\") — power ends up literally sitting on top of the standard"}, "ex": "任何特權都不該凌駕於法律之上。"}, {"h": "等同於", "p": "děngtóng yú", "ja": {"m": "〜と同等とみなされる、イコールである", "i": "「等同」（同じにする）の結果が「於」で比較対象に固定され、異なる二つの事柄が同一の意味に結び付けられることを表す"}, "en": {"m": "to be equated with, to be tantamount to", "i": "等同 (\"being made equal\") is pinned by 於 onto its counterpart — two different things end up locked together as the same"}, "ex": "保持沉默不能等同於默許這種行為。"}, {"h": "局限於", "p": "júxiàn yú", "ja": {"m": "〜に限定される、とどまる", "i": "「局限」（狭く区切る）の結果が「於」でその範囲に固定され、視野や条件が枠の内側に閉じ込められる結果を表す"}, "en": {"m": "to be confined to, to be limited to", "i": "局限 (\"being boxed in\") is pinned by 於 onto a narrow scope — the view or condition ends up locked inside that boundary"}, "ex": "他的觀察不能只局限於表面的數據。"}, {"h": "游離於……之外", "p": "yóulí yú...zhī wài", "ja": {"m": "〜から遊離する、枠組みの外に漂う", "i": "「游離」（漂って離れる）の結果が「於……之外」でその枠組みの外側に位置づけられ、主流から外れて漂う状態を表す"}, "en": {"m": "to drift apart from, to remain detached from (a system)", "i": "游離 (\"drifting loose\") settles via 於……之外 (\"outside of X\") — the subject ends up floating apart from the mainstream framework"}, "ex": "這位藝術家始終游離於主流市場之外。"}, {"h": "著眼於", "p": "zhuóyǎn yú", "ja": {"m": "〜に着目する、主眼を置く", "i": "「著眼」（目を付ける）の結果が「於」でその対象に固定され、視点や戦略がそこに定まる結果を表す"}, "en": {"m": "to focus on, to set one's sights on", "i": "著眼 (\"fixing the eye\") is anchored by 於 onto its target — strategic attention settles and stays right there"}, "ex": "這項改革著眼於長遠的社會公平。"}, {"h": "見稱於世", "p": "jiànchēng yú shì", "ja": {"m": "世間に称賛される、名声を博す", "i": "受身の「見」＋「稱」（称えられる）の結果が「於世」（世間において）に固定され、評判が広く社会に定着したことを表す"}, "en": {"m": "to be renowned throughout the world", "i": "passive 見 (\"being\") + 稱 (\"praised\") is anchored by 於世 (\"in the world\") — the reputation settles and spreads across all of society"}, "ex": "這位工藝大師以精湛的手藝見稱於世。"}, {"h": "大白於天下", "p": "dàbái yú tiānxià", "ja": {"m": "（真相が）世間にすっかり明らかになる", "i": "「大白」（真っ白に明らかになる）の結果が「於天下」（天下において）に固定され、隠された事実が世界中に露呈する結果を表す"}, "en": {"m": "to come fully to light before the whole world (of truth)", "i": "大白 (\"becoming fully clear\") is anchored by 於天下 (\"under the whole sky\") — the hidden truth ends up exposed to everyone, everywhere"}, "ex": "歷經多年偵查，這起懸案終於真相大白於天下。"}, {"h": "告終", "p": "gàozhōng", "ja": {"m": "（〜という形で）幕を閉じる、終わる", "i": "「告」（告げる、至る）が「終」（終わり）に至ることを述べ、進行していた過程が最終的な結末に到達したことを表す"}, "en": {"m": "to come to an end, to conclude (usu. \"as X\")", "i": "告 (\"announcing/arriving\") reaches 終 (\"the end\") — a process that was running finally arrives at its final stopping point"}, "ex": "這場漫長的談判最終以破局告終。"}, {"h": "奏效", "p": "zòuxiào", "ja": {"m": "（対策などが）効を奏する、効果を発揮する", "i": "「奏」（発揮する）の結果が「效」（効果）として現れ、施した対策が期待通りの結果を生んだことを表す"}, "en": {"m": "to take effect, to work as intended", "i": "奏 (\"bringing forth\") produces 效 (\"effect\") — the measure applied actually delivers the outcome it was meant to"}, "ex": "新的行銷策略很快奏效，銷量明顯回升。"}, {"h": "致死", "p": "zhìsǐ", "ja": {"m": "死に至らしめる", "i": "「致」（至らせる）の結果が「死」に到達し、原因が最終的に生命を奪う結末を招くことを表す"}, "en": {"m": "to cause death, to be fatal", "i": "致 (\"causing to arrive at\") delivers straight to 死 (\"death\") — the cause runs its full course to a fatal outcome"}, "ex": "這種毒蛇的咬傷若不及時治療，可能致死。"}, {"h": "見好", "p": "jiànhǎo", "ja": {"m": "（病状・局面が）快方に向かう", "i": "「見」（現れる）の結果が「好」（良い状態）として現れ始め、悪化していたものが好転の兆しを見せることを表す"}, "en": {"m": "to take a turn for the better, to improve", "i": "見 (\"appearing\") produces 好 (\"goodness\") — a declining situation shows its first visible signs of turning around"}, "ex": "經過治療，父親的病情已明顯見好。"}, {"h": "吃透", "p": "chītòu", "ja": {"m": "深く理解し自分のものにする", "i": "「吃」（吸収する、消化する）の結果が「透」（突き抜ける）にまで至り、内容を芯まで完全に消化・把握したことを表す"}, "en": {"m": "to fully digest and master (a subject or policy)", "i": "吃 (\"consuming/digesting\") pushes through to 透 (\"all the way through\") — the material is absorbed so completely it becomes internalized"}, "ex": "他花了半年時間才把這份合約條款吃透。"}, {"h": "看扁", "p": "kànbiǎn", "ja": {"m": "人を見くびる、過小評価する", "i": "「看」（見る）の結果が「扁」（平べったい）となり、立体的な人物や能力を薄っぺらく見て侮る結果を表す"}, "en": {"m": "to look down on, to underestimate someone", "i": "看 (\"viewing\") flattens the person into 扁 (\"flat\") — a three-dimensional person or ability gets reduced to something thin and unworthy of respect"}, "ex": "別把年輕人看扁了，他們的潛力不容小覷。"}, {"h": "說破", "p": "shuōpò", "ja": {"m": "（秘密や核心を）ズバリと言い当てる", "i": "「說」（言う）の結果が「破」（突き破る）に至り、オブラートに包まれていた事柄を言葉で突き通して露わにすることを表す"}, "en": {"m": "to spell out bluntly, to say outright what was left unsaid", "i": "說 (\"speaking\") acts like 破 (\"breaking through\") — words puncture the polite wrapping and expose what everyone was avoiding saying"}, "ex": "大家心知肚明，卻沒人願意把話說破。"}, {"h": "識破", "p": "shípò", "ja": {"m": "（策略や嘘を）見破る", "i": "「識」（見分ける）の結果が「破」（突き破る）に至り、偽装や策略の表面を見抜いて中身を露呈させることを表す"}, "en": {"m": "to see through, to expose (a scheme or lie)", "i": "識 (\"discerning\") acts as 破 (\"breaking through\") — the disguise is pierced and the trick underneath is laid bare"}, "ex": "他精心策劃的騙局，很快就被警方識破。"}, {"h": "恰到好處", "p": "qiàdào hǎochù", "ja": {"m": "ちょうどよい程度に達している、絶妙だ", "i": "「恰」（ちょうど）が「到」（到達する）「好處」（良い所）に至り、過不足なく最適な地点に正確に落ち着く結果を表す"}, "en": {"m": "just right, hitting the perfect balance", "i": "恰 (\"precisely\") + 到 (\"arriving at\") + 好處 (\"the sweet spot\") shows an action lands exactly on the ideal point, neither too much nor too little"}, "ex": "這道菜的調味恰到好處，鹹淡拿捏得剛剛好。"}, {"h": "躍然紙上", "p": "yuèrán zhǐshàng", "ja": {"m": "（描写が生き生きとして）紙面に躍り出るようだ", "i": "「躍然」（躍り出るさま）の結果が「紙上」（紙の上）に至り、文章や絵の描写が生き生きとしすぎて紙から飛び出して見えるほどの効果を表す"}, "en": {"m": "to leap off the page, vividly brought to life (in writing or art)", "i": "躍然 (\"leaping vividly\") lands on 紙上 (\"the surface of the page\") — the description is so lifelike it seems to jump right off the paper"}, "ex": "作者筆下的人物性格鮮明，簡直躍然紙上。"}],intro:{"zh": "表示動作帶來的高階／書面結果，常見於新聞、論文與正式文書。", "ja": "動作がもたらす高度な・書面語的な「結果」を表します。ニュースや論文でよく使われます。", "en": "Expresses an advanced, literary result an action brings about — common in news, essays, and formal writing."}},
{id:"adir",name:"方向補語",short:"趨向",color:"var(--c-direction)",tint:"var(--c-direction-tint)",cards:[{"h": "呈現出", "p": "chéngxiàn chū", "ja": {"m": "（ある特徴や状態が）現れ出る、呈する", "i": "「出」が『無から有への出現』を表し、内在していた特質や状態が表面化して見える様子を示す"}, "en": {"m": "to emerge, to present (a quality or state)", "i": "\"出\" marks something moving from hidden to visible — an inner quality or state coming out into view"}, "ex": "這幅畫呈現出畫家晚年孤獨而寧靜的心境。"}, {"h": "暴露出", "p": "bàolù chū", "ja": {"m": "（欠陥や問題が）露呈する", "i": "「出」によって、隠れていた欠陥や本質が覆いを剝がされるように表に出てくることを表す"}, "en": {"m": "to expose, to lay bare (a flaw or problem)", "i": "\"出\" turns 暴露 (to expose) into a completed emergence — the flaw breaks through its cover and becomes visible"}, "ex": "這次危機處理暴露出公司內部管理的重大缺陷。"}, {"h": "折射出", "p": "zhéshè chū", "ja": {"m": "（間接的に）反映する、映し出す", "i": "光が屈折して像を結ぶように、「出」は現象の背後にある本質が間接的な形で見えてくることを表す"}, "en": {"m": "to reflect, to mirror (indirectly)", "i": "like light bending through a prism, \"出\" shows an underlying truth becoming visible only indirectly, through some other phenomenon"}, "ex": "這部小說折射出那個時代知識分子的迷惘與掙扎。"}, {"h": "凸顯出來", "p": "tūxiǎn chūlái", "ja": {"m": "（重要性・矛盾が）際立って現れる", "i": "「凸顯」自体が隆起して見える意味を持ち、「出來」がその視覚的な浮き上がりを完成した動作として強調する"}, "en": {"m": "to stand out sharply, to become starkly evident", "i": "\"凸\" already pictures something bulging upward; \"出來\" completes that image, marking the moment it fully surfaces into plain view"}, "ex": "這次疫情把城鄉醫療資源的差距凸顯出來了。"}, {"h": "引發起來", "p": "yǐnfā qǐlái", "ja": {"m": "（議論・世論を）巻き起こす", "i": "「起來」が静止していたものが一気に立ち上がり動き出すイメージを与え、議論や感情が引き金によって一斉に湧き上がる様子を表す"}, "en": {"m": "to touch off, to stir up (debate or sentiment)", "i": "\"起來\" pictures something dormant suddenly rising up and spreading — the trigger (引發) sets a wave of reaction into motion"}, "ex": "這篇報導在網路上引發起來一場激烈的論戰。"}, {"h": "流傳下來", "p": "liúchuán xiàlái", "ja": {"m": "（伝統・言い伝えが）代々伝わってくる", "i": "「下來」が過去から現在へと途切れず受け継がれてきた時間の流れを表し、消えずに残ってきたことを強調する"}, "en": {"m": "to be passed down, to survive through generations", "i": "\"下來\" traces a line from past to present — the tradition has kept coming down through time without breaking off"}, "ex": "這道古法釀酒的技術是祖先一代代流傳下來的。"}, {"h": "沉澱下來", "p": "chéndiàn xiàlái", "ja": {"m": "（経験・知識が）蓄積されて定着する", "i": "液体中の粒子が底に沈んで落ち着くように、「下來」は時間をかけて心や知識の中に静かに積もり定着する過程を表す"}, "en": {"m": "to settle, to quietly accumulate (experience or knowledge)", "i": "like sediment sinking to the bottom of water, \"下來\" pictures experience quietly settling and taking root over time"}, "ex": "這些年的失敗經驗，慢慢沉澱下來，成了他最寶貴的財富。"}, {"h": "貫徹下去", "p": "guànchè xiàqù", "ja": {"m": "（方針・理念を）最後まで貫き通す", "i": "「下去」は現在から未来へ向かう持続を表し、途中でやめずに最後までやり抜く意志を強調する"}, "en": {"m": "to carry through, to see (a policy or principle) to the end", "i": "\"下去\" projects forward from now into the future — the principle must keep being pushed onward without stopping halfway"}, "ex": "這項改革政策必須堅定不移地貫徹下去，不能半途而廢。"}, {"h": "推廣開來", "p": "tuīguǎng kāilái", "ja": {"m": "（技術・制度が）広く普及していく", "i": "「開來」は一点から四方八方へ広がっていくイメージを与え、狭い範囲から社会全体へ広まる様子を表す"}, "en": {"m": "to spread widely, to become popularized", "i": "\"開來\" pictures something unfolding outward from a single point in every direction — the practice spreads from a small start to wide use"}, "ex": "這種節水灌溉技術一旦推廣開來，將大幅改善乾旱地區的農業。"}, {"h": "隔絕開來", "p": "géjué kāilái", "ja": {"m": "（関係・接触を）完全に遮断する", "i": "「開來」が両者の間に隙間を作って広げていくイメージを与え、繋がりを断ち切って離す結果を強調する"}, "en": {"m": "to cut off completely, to isolate (from contact)", "i": "\"開來\" pictures a gap opening and widening between two sides — the connection is severed and the distance is forced apart"}, "ex": "醫院立刻將確診病患與其他病人隔絕開來，以防疫情擴散。"}, {"h": "蔓延開來", "p": "mànyán kāilái", "ja": {"m": "（病気・悪習が）社会に広がっていく", "i": "つるが伸びるように「蔓延」し、「開來」がその広がりが四方八方に及ぶ結果を強調する"}, "en": {"m": "to spread, to run rampant (disease or a bad trend)", "i": "\"蔓\" pictures a vine creeping outward; \"開來\" shows that creeping spread reaching in every direction until it's out of control"}, "ex": "這種造假的歪風一旦蔓延開來，整個行業的信譽都會受損。"}, {"h": "演變下來", "p": "yǎnbiàn xiàlái", "ja": {"m": "（歴史を経て）現在の形に変化してきた", "i": "「下來」が過去から現在まで続く時間の軸を表し、長い変化の過程を経て今の姿に落ち着いたことを示す"}, "en": {"m": "to have evolved (into the present form) over time", "i": "\"下來\" traces the passage from past to present — the thing has gradually changed along the way and settled into what it is now"}, "ex": "這套禮俗是從古代祭祀儀式演變下來的。"}, {"h": "孤立起來", "p": "gūlì qǐlái", "ja": {"m": "（ある要素を）切り離して考える、孤立させる", "i": "「起來」がばらばらだったものを一つのまとまりとして囲い込むイメージを与え、対象を周囲から切り離してひとつの単位として扱う操作を表す"}, "en": {"m": "to isolate, to treat separately (an element or factor)", "i": "\"起來\" here bundles the target into its own separate unit — pulling it out of its surroundings so it can be examined on its own"}, "ex": "分析這個變數時，我們得先把它孤立起來，排除其他因素的干擾。"}, {"h": "席捲而來", "p": "xíjuǎn ér lái", "ja": {"m": "（流行・災害が）猛烈な勢いで押し寄せる", "i": "筵（むしろ）を巻き上げるように何もかも一気に巻き込みながら迫ってくる様子を「而來」が方向として結びつける"}, "en": {"m": "to sweep in, to come with overwhelming force", "i": "\"席捲\" pictures rolling everything up like a mat being swept away; \"而來\" points that unstoppable sweep straight at the speaker"}, "ex": "金融海嘯席捲而來，無數企業在一夕之間宣告破產。"}, {"h": "接踵而來", "p": "jiēzhǒng ér lái", "ja": {"m": "（問題・出来事が）次から次へとやってくる", "i": "前の人のかかとに次の人のつま先が接するほど間を置かず続く様子から、事態が絶え間なく連続して起こることを表す"}, "en": {"m": "to come one after another, in quick succession", "i": "pictures people walking so close that each one's toes touch the heels ahead — events arrive with no gap between them"}, "ex": "公司才解決完財務危機，人事糾紛又接踵而來。"}, {"h": "蜂擁而來", "p": "fēngyōng ér lái", "ja": {"m": "（群衆・資金が）蜂のように群がって押し寄せる", "i": "蜂の群れが一斉に飛びかかるように、大勢の人や物が無秩序かつ勢いよく一方向に集まってくる様子を表す"}, "en": {"m": "to swarm in, to flock in en masse", "i": "pictures a swarm of bees descending all at once — a crowd or rush of things converging chaotically toward one point"}, "ex": "消息一傳出，投資人便蜂擁而來，搶購這檔新股。"}, {"h": "歸納起來", "p": "guīnà qǐlái", "ja": {"m": "要約すると、まとめると", "i": "「起來」が散らばっていた情報や論点を一つの枠の中にまとめ上げる動作を表す"}, "en": {"m": "to sum up, to generalize", "i": "\"起來\" gathers scattered points and folds them into one bundle — the many becomes a single, condensed conclusion"}, "ex": "歸納起來，這次失敗的原因不外乎三點：資金、時機與團隊。"}, {"h": "看上", "p": "kànshàng", "ja": {"m": "気に入る、見初める", "i": "「上」が視線や好みの対象にぴたりと吸い付いて離れないイメージを与え、選び取って心を留める結果を表す"}, "en": {"m": "to take a liking to, to set one's sights on", "i": "\"上\" pictures the gaze locking onto a target and sticking there — the eye lands on something and claims it as the chosen one"}, "ex": "他一眼就看上了櫥窗裡那件大衣，毫不猶豫地買下了。"}, {"h": "迷上", "p": "míshàng", "ja": {"m": "（趣味などに）夢中になる、ハマる", "i": "「上」が心を対象にぴったり吸着させるイメージを与え、抜け出せないほど惹きつけられる結果を強調する"}, "en": {"m": "to become obsessed with, to get hooked on", "i": "\"上\" pictures the mind fusing onto its object — once attached, attention can no longer pull away"}, "ex": "自從去了一趟西藏，他就迷上了攝影，假日都往山裡跑。"}, {"h": "說不上來", "p": "shuō bu shànglái", "ja": {"m": "（言葉が出かかっているのに）うまく言えない", "i": "「上來」は口から外へ言葉を引っ張り出す方向を表し、その否定形「不上來」は言葉が喉でつかえて出てこない状態を示す"}, "en": {"m": "to be unable to put into words", "i": "\"上來\" pictures words being pulled up and out through the mouth; the negated form shows them stuck partway, unable to surface"}, "ex": "這幅畫哪裡特別，我一時說不上來，但就是覺得很美。"}, {"h": "算下來", "p": "suàn xiàlái", "ja": {"m": "トータルで計算すると", "i": "「下來」が計算の結果を最後に地面に下ろして固定させるイメージを与え、最終的な数字が確定する様子を表す"}, "en": {"m": "all told, when you work it out", "i": "\"下來\" pictures the running total finally being set down and fixed in place — the calculation lands on its final figure"}, "ex": "每個月的房租加上水電，算下來一年要花掉他大半的薪水。"}, {"h": "靜下心來", "p": "jìng xià xīn lái", "ja": {"m": "心を落ち着かせる", "i": "「下」で浮ついていた心を低い位置に落ち着かせ、「來」でその安定した状態を話し手の視点に引き寄せて完成させる"}, "en": {"m": "to calm oneself down, to settle one's mind", "i": "\"下\" lowers the restless mind into a settled position, and \"來\" completes that settling as a state now fully in place"}, "ex": "遇到再大的挫折，也要先靜下心來，才能想出對策。"}],intro:{"zh": "表示動作朝向某個方向發展的抽象、比喻用法，常見於書面語與新聞報導。", "ja": "動作が向かう「方向」の抽象的・比喩的な用法を表します。書面語やニュースによく見られます。", "en": "Expresses abstract, figurative extensions of directional complements — common in written and news register."}},
{id:"apot",name:"可能補語",short:"可能",color:"var(--c-potential)",tint:"var(--c-potential-tint)",cards:[{"h": "談不上", "p": "tánbushàng", "ja": {"m": "～と言うほどではない、そのレベルに達していない", "i": "「上」は基準に到達する方向を表し、「不上」でその基準にすら届かず、話題にする資格がないことを示す"}, "en": {"m": "to not even qualify as, to be nowhere near (a certain level)", "i": "\"上\" marks reaching up to a standard; \"不上\" says the thing doesn't even get that far — too slight to be called by that name"}, "ex": "這只是隨手畫畫，談不上什麼藝術創作。"}, {"h": "怪不得", "p": "guàibude", "ja": {"m": "どうりで～なわけだ、～を責められない", "i": "「怪」（責める）＋「不得」（できない）で、理由が分かった今となっては相手を責めることができないという納得の気持ちを表す"}, "en": {"m": "no wonder; can't be blamed for it", "i": "\"怪\" (to blame) plus \"不得\" (cannot) — once the reason is clear, there's no basis left to blame anyone"}, "ex": "原來他昨晚熬夜趕報告，怪不得今天上課一直打瞌睡。"}, {"h": "恨不得", "p": "hènbude", "ja": {"m": "喉から手が出るほど～したい", "i": "「恨」（悔やむ）ほどの強い願望が「不得」（叶えられない）という現実にぶつかり、切実さを誇張して表す"}, "en": {"m": "to be dying to, to wish desperately (that one could)", "i": "\"恨\" (a bitter, aching longing) collides with \"不得\" (cannot) — the wish is so intense it borders on frustration at not already having it"}, "ex": "聽到放假的消息，他恨不得馬上飛奔回家。"}, {"h": "怨不得", "p": "yuànbude", "ja": {"m": "～を責めるわけにはいかない、～のせいにできない", "i": "「怨」（恨む）＋「不得」（できない）で、事情を知れば相手や状況を恨む余地がないことを表す"}, "en": {"m": "can't be blamed on, no grounds to resent", "i": "\"怨\" (to resent) plus \"不得\" (cannot) — given the full picture, there's no fair basis left to hold it against anyone"}, "ex": "這次失敗是計畫本身有漏洞，怨不得執行團隊不努力。"}, {"h": "要不得", "p": "yàobude", "ja": {"m": "（品質・態度が）お話にならない、絶対によくない", "i": "「要」（受け入れる）＋「不得」（できない）で、そのやり方や考え方は到底容認できないことを表す"}, "en": {"m": "unacceptable, absolutely not to be tolerated", "i": "\"要\" (to accept, to take) plus \"不得\" (cannot) — the attitude or method is one that simply cannot be allowed to stand"}, "ex": "這種欺騙客戶的手段實在要不得，遲早會砸了招牌。"}, {"h": "使不得", "p": "shǐbude", "ja": {"m": "（その方法は）使うべきではない、通用しない", "i": "「使」（用いる）＋「不得」（できない）で、その手段を実際に用いることは許されない、あるいは効果がないことを示す"}, "en": {"m": "won't do, must not be used (of a method or action)", "i": "\"使\" (to use) plus \"不得\" (cannot) — the method itself is one that must not be put into practice"}, "ex": "這種土法煉鋼的做法在正式生產線上使不得。"}, {"h": "摸不著", "p": "mōbuzháo", "ja": {"m": "（核心・意味が）掴めない", "i": "「摸」（手探りする）＋「不著」（触れる結果に至らない）で、手を伸ばしても実体や要点に触れられない状態を表す"}, "en": {"m": "unable to grasp, out of reach (of understanding)", "i": "\"摸\" (to feel around for) plus \"不著\" (fails to make contact) — reaching out but never quite touching the thing you're after"}, "ex": "他這番話說得太玄，大家聽完還是摸不著頭緒。"}, {"h": "對得起", "p": "duìdeqǐ", "ja": {"m": "（期待や恩に）報いる、顔向けができる", "i": "「對」（向き合う）＋「得起」（それに堪えられる）で、相手の期待や恩義に見合うだけの行いができていることを示す"}, "en": {"m": "to be worthy of, to live up to (someone's trust or sacrifice)", "i": "\"對\" (to face) plus \"得起\" (can bear the weight of it) — one's conduct is solid enough to stand and face the other person without shame"}, "ex": "他辭去高薪工作回鄉教書，才覺得對得起自己當初的理想。"}, {"h": "過得去", "p": "guòdeqù", "ja": {"m": "まずまずだ、なんとか通用する；（心情的に）申し訳が立つ", "i": "「過」（通り過ぎる）＋「得去」（そこまで行き着ける）で、基準ぎりぎりを何とかクリアできる、あるいは良心に照らして許容できることを表す"}, "en": {"m": "passable, good enough to get by; (of conscience) able to live with it", "i": "\"過\" (to pass through) plus \"得去\" (can make it over there) — just barely clearing the bar, whether a minimum standard or one's own conscience"}, "ex": "這道菜的味道還過得去，不算難吃。"}, {"h": "划得來/划不來", "p": "huádelái/huábulái", "ja": {"m": "割に合う／割に合わない", "i": "「划」（そろばんを弾く、採算を計算する）＋「得來/不來」で、コストと利益を天秤にかけた結果、引き受ける価値があるかないかを判断する"}, "en": {"m": "worth it / not worth it (in a cost-benefit sense)", "i": "\"划\" (to reckon, as if working an abacus) plus \"得來/不來\" weighs cost against benefit and delivers a verdict on whether the deal pays off"}, "ex": "花三小時排隊只為省五十塊，實在划不來。"}, {"h": "靠得住/靠不住", "p": "kàodezhù/kàobuzhù", "ja": {"m": "頼りになる／頼りにならない", "i": "「靠」（寄りかかる）＋「得住/不住」（その重みに持ちこたえられるか）で、人や物に体重を預けても崩れないかどうかを表す"}, "en": {"m": "reliable / unreliable", "i": "\"靠\" (to lean on) plus \"得住/不住\" (able or unable to hold firm under that weight) — can this person or thing bear the weight of your trust without giving way"}, "ex": "這個廠商的品質靠得住，合作了十年從沒出過問題。"}, {"h": "受得了/受不了", "p": "shòudeliǎo/shòubuliǎo", "ja": {"m": "耐えられる／耐えられない", "i": "「受」（受け止める）＋「得了/不了」（最後までやり遂げられるか）で、苦痛や負担を最後まで受け止めきれるかどうかを表す"}, "en": {"m": "able to bear it / unable to stand it", "i": "\"受\" (to take on, absorb) plus \"得了/不了\" (able or unable to see it through to the end) — can you keep absorbing this hardship all the way through"}, "ex": "這裡夏天又濕又熱，外地人常常受不了。"}, {"h": "經得起/經不起", "p": "jīngdeqǐ/jīngbuqǐ", "ja": {"m": "（試練に）耐えられる／耐えられない", "i": "「經」（経る、経験する）＋「得起/不起」（その過程を支えきれるか）で、繰り返しの検証や試練に持ちこたえられるかを表す"}, "en": {"m": "able to withstand / unable to withstand (testing or scrutiny)", "i": "\"經\" (to go through, undergo) plus \"得起/不起\" (able or unable to hold up under it) — can the thing survive repeated testing without breaking down"}, "ex": "這份數據經得起任何審計單位的反覆檢驗。"}, {"h": "犯不著", "p": "fànbuzháo", "ja": {"m": "～する必要はない、そこまでする価値がない", "i": "「犯」（わざわざ手を出す・冒す）＋「不著」（それに見合う結果に届かない）で、そんなリスクや手間をかける価値がないことを表す"}, "en": {"m": "not worth doing, no need to bother", "i": "\"犯\" (to risk, to bother incurring) plus \"不著\" (doesn't reach a payoff) — the trouble or risk isn't matched by any worthwhile return"}, "ex": "為了這點小事跟他吵架，實在犯不著。"}, {"h": "顧不得", "p": "gùbude", "ja": {"m": "～を気にかけている余裕がない、構っていられない", "i": "「顧」（気にかける、振り返る）＋「不得」（その余裕がない）で、他のことに手一杯で、ある事柄にまで注意を向けられない状態を表す"}, "en": {"m": "to have no time or energy to worry about, unable to attend to", "i": "\"顧\" (to look after, pay heed to) plus \"不得\" (no capacity left for it) — so consumed by one thing that there's no attention left to spare for another"}, "ex": "火警一響，他什麼都顧不得了，拔腿就往外跑。"}],intro:{"zh": "表示「能不能」做到某件事的高階慣用組合，常帶有固定搭配與委婉語氣。", "ja": "「できる／できない」を表す高度な慣用的組み合わせで、婉曲的なニュアンスを伴うことが多いです。", "en": "Advanced, idiomatic can/cannot combinations, often carrying a softened or indirect tone."}},
{id:"aidiom",name:"成語化可能補語",short:"成語",color:"var(--c-idiom)",tint:"var(--c-idiom-tint)",cards:[{"h": "迫不得已", "p": "pò bùdéyǐ", "ja": {"m": "やむを得ず、そうせざるを得ない", "i": "「迫」（追い詰められる）＋「不得已」（やめることができない）で、外からの圧力によって他に選択肢が残されていない状態を表す"}, "en": {"m": "forced into it, having no other choice", "i": "\"迫\" (to be pressed/forced) combines with \"不得已\" (cannot do otherwise) — pressure from outside leaves literally no alternative"}, "ex": "公司資金周轉不靈，迫不得已只好裁員。"}, {"h": "必不可少", "p": "bì bùkě shǎo", "ja": {"m": "絶対に欠かせない、必須である", "i": "「必」（必ず）＋「不可少」（少なくすることが許されない）で、これ以上減らせない最低限の必要性を強調する"}, "en": {"m": "absolutely essential, indispensable", "i": "\"必\" (definitely) plus \"不可少\" (cannot be reduced or lacking) — this is the floor below which the amount cannot fall"}, "ex": "良好的溝通是團隊合作中必不可少的一環。"}, {"h": "微不足道", "p": "wēi bùzú dào", "ja": {"m": "取るに足らない、口にするほどのものではない", "i": "「微」（わずか）＋「不足道」（語るに値しない）で、あまりにも小さく、話題にする価値すらないことを表す"}, "en": {"m": "negligible, too trivial to mention", "i": "\"微\" (tiny) plus \"不足道\" (not worth speaking of) — the thing is so small it doesn't even clear the bar for being worth talking about"}, "ex": "跟你的付出相比，我這點小忙實在微不足道。"}, {"h": "深不可測", "p": "shēn bùkě cè", "ja": {"m": "底知れず深い、予測不可能である", "i": "「深」（深い）＋「不可測」（測ることができない）で、深さや本質が測定の限界を超えていることを表す"}, "en": {"m": "unfathomable, impossible to gauge", "i": "\"深\" (deep) plus \"不可測\" (cannot be measured) — the depth exceeds any instrument's ability to sound it"}, "ex": "他這個人心思深不可測，誰也猜不透他真正的打算。"}, {"h": "牢不可破", "p": "láo bùkě pò", "ja": {"m": "（強固で）絶対に破れない", "i": "「牢」（頑丈な檻・牢獄）＋「不可破」（破ることができない）で、堅く結びついた状態が壊されようがないことを表す"}, "en": {"m": "unbreakable, ironclad", "i": "\"牢\" (a sturdy cage or prison) plus \"不可破\" (cannot be broken) — the bond is locked so solidly that nothing can force it open"}, "ex": "兩人多年並肩作戰，建立起牢不可破的信任關係。"}, {"h": "遙不可及", "p": "yáo bùkě jí", "ja": {"m": "遥か彼方にあって手が届かない", "i": "「遙」（はるか遠い）＋「不可及」（追いつくことができない）で、目標が視界には入っていても距離的に到達不可能であることを表す"}, "en": {"m": "distant and unattainable, out of reach", "i": "\"遙\" (far, distant) plus \"不可及\" (cannot be reached) — the goal is visible on the horizon but the distance makes it impossible to close"}, "ex": "對當年的他來說，出國留學是一個遙不可及的夢想。"}, {"h": "堅不可摧", "p": "jiān bùkě cuī", "ja": {"m": "（意志・防衛が）極めて堅固で破壊できない", "i": "「堅」（堅い）＋「不可摧」（打ち砕くことができない）で、外力を受けても崩れない強靭さを強調する"}, "en": {"m": "indestructible, impregnable", "i": "\"堅\" (hard, firm) plus \"不可摧\" (cannot be crushed) — no force applied from outside can break through this strength"}, "ex": "這座軍事要塞號稱堅不可摧，從未被敵軍攻陷。"}, {"h": "難能可貴", "p": "nánnéng kěguì", "ja": {"m": "めったにできないことで、極めて価値がある", "i": "「難能」（行うのが難しい）にもかかわらず「可貴」（貴ぶべき）であるとし、困難さゆえの価値の高さを強調する"}, "en": {"m": "rare and commendable, all the more valuable for being hard to achieve", "i": "\"難能\" (hard to accomplish) is paired with \"可貴\" (worthy of prizing) — the very difficulty of doing it is what makes it precious"}, "ex": "在資源如此匱乏的情況下還能堅持研究，實在難能可貴。"}, {"h": "情不自禁", "p": "qíng bùzì jīn", "ja": {"m": "思わず～してしまう、感情を抑えられない", "i": "「情」（感情）＋「不自禁」（自分で自分を禁じることができない）で、理性のコントロールを超えて感情が行動を突き動かす様子を表す"}, "en": {"m": "unable to help oneself, overcome with emotion", "i": "\"情\" (feeling) plus \"不自禁\" (cannot restrain oneself) — emotion overrides self-control and drives the action before reason can intervene"}, "ex": "聽到久違的鄉音，她情不自禁地流下了眼淚。"}, {"h": "美不可言", "p": "měi bùkě yán", "ja": {"m": "言葉では言い表せないほど美しい", "i": "「美」（美しい）＋「不可言」（言葉にすることができない）で、美しさが言語表現の限界を超えていることを表す"}, "en": {"m": "indescribably beautiful", "i": "\"美\" (beautiful) plus \"不可言\" (cannot be put into words) — the beauty exceeds what language is capable of capturing"}, "ex": "日出時雲海翻騰，整片山景美不可言。"}, {"h": "百思不得其解", "p": "bǎisī bùdé qí jiě", "ja": {"m": "いくら考えても納得がいかない、理解できない", "i": "「百思」（何度も何度も考える）にもかかわらず「不得其解」（その答えを得ることができない）とし、思考を尽くしても解決に至らない徒労感を表す"}, "en": {"m": "utterly baffled despite endless thought", "i": "\"百思\" (thinking it over a hundred times) collides with \"不得其解\" (still cannot obtain the solution) — exhaustive effort that never lands on an answer"}, "ex": "這件事的來龍去脈，他至今百思不得其解。"}, {"h": "求之不得", "p": "qiú zhī bùdé", "ja": {"m": "願ってもないことだ、渡りに船だ", "i": "「求之」（それを求める）にもかかわらず「不得」（得られない）ほど貴重なものが、実際に手に入る幸運を強調する"}, "en": {"m": "a stroke of luck, exactly what one was hoping for", "i": "\"求之不得\" literally says \"even seeking it, one couldn't get it\" — so when it actually falls into your lap, it's framed as too good to have hoped for"}, "ex": "能得到業界權威的親自指導，這對他來說真是求之不得的機會。"}, {"h": "站得住腳", "p": "zhàndezhù jiǎo", "ja": {"m": "（論理・立場が）成立する、筋が通っている", "i": "「站」（立つ）＋「得住」（その状態を保てる）＋「腳」（足元）で、論拠や立場が崩れずにしっかり立っていられることを比喩的に表す"}, "en": {"m": "to hold up, to be well-founded (of an argument or position)", "i": "\"站得住腳\" literally means \"can stand firm on one's feet\" — the argument is solid enough not to topple when pushed"}, "ex": "他提出的證據站得住腳，法官最終採信了他的說法。"}],intro:{"zh": "由可能補語結構凝固而成的四字成語，整體已是固定用法，不可拆解替換。", "ja": "可能補語の構造がそのまま四字熟語化したもので、全体が固定表現として使われます。", "en": "Four-character idioms that crystallized from the potential-complement pattern — used as fixed, unsplittable units."}},
{id:"avv",name:"動詞＋動詞結果補語",short:"動補",color:"var(--c-vv)",tint:"var(--c-vv-tint)",cards:[{"h": "看膩", "p": "kàn nì", "ja": {"m": "見飽きる、見て嫌になる", "i": "「膩」は本来「脂っこい」の意味で、同じものを見続けた結果、胃もたれするように心理的に飽きてしまう状態を表す"}, "en": {"m": "to grow sick of the sight of something", "i": "膩 literally means 'greasy' — like food too oily to stomach, so repeated looking curdles into distaste"}, "ex": "這部連續劇拖了太久，觀眾早就看膩了。"}, {"h": "吃膩", "p": "chī nì", "ja": {"m": "食べ飽きる", "i": "「膩」の用法は「看膩」と同じで、同じ料理を食べ続けた結果、脂っこさに胃も心も疲れて食欲を失う状態を表す"}, "en": {"m": "to get tired of eating something", "i": "same 膩 logic as 看膩 — repeated eating of the same food turns into a greasy, appetite-killing overload"}, "ex": "便當吃了一整個月，員工們早就吃膩了。"}, {"h": "聽厭", "p": "tīng yàn", "ja": {"m": "聞き飽きる、聞いてうんざりする", "i": "「厭」は「嫌気がさす」という拒絶感情を表し、同じ話や音を聞かされ続けた結果、精神的に拒否反応が起きることを示す"}, "en": {"m": "to grow weary of hearing something", "i": "厭 carries active aversion, not mere boredom — repeated hearing builds up into a real psychological rejection"}, "ex": "那首洗腦神曲電台天天放，大家都聽厭了。"}, {"h": "說服", "p": "shuō fú", "ja": {"m": "説得する、納得させる", "i": "「服」は「従う、心から納得する」の意で、話す（說）という行為が相手の心を服従・納得させる結果に至ったことを示す"}, "en": {"m": "to persuade, to win someone over", "i": "服 means 'to yield, to be convinced' — the talking (說) is the action, and the other person's mind submitting is the result"}, "ex": "他花了一個下午，終於說服父母讓他休學去旅行。"}, {"h": "推翻", "p": "tuī fān", "ja": {"m": "覆す、転覆させる", "i": "「翻」は物が「ひっくり返る」様子で、押す（推）という力が対象を完全に裏返し、政権や定説を崩す結果を表す"}, "en": {"m": "to overturn, to topple", "i": "翻 pictures something flipping upside-down — the push (推) is forceful enough to flip a regime, theory, or verdict completely over"}, "ex": "新出土的證據推翻了原本的判決結果。"}, {"h": "打倒", "p": "dǎ dǎo", "ja": {"m": "打ち倒す、打倒する", "i": "「倒」は「バタンと倒れる」様子で、打つ（打）という力が対象を立っていられない状態に追い込む結果を表す"}, "en": {"m": "to strike down, to defeat", "i": "倒 depicts something toppling over — the strike (打) is strong enough to knock the target off its feet, literally or politically"}, "ex": "這場選舉，反對派誓言要打倒現任的貪腐政府。"}, {"h": "看走眼", "p": "kàn zǒu yǎn", "ja": {"m": "見誤る、目利きを誤る", "i": "「走」は「逸れる、それる」の意で、見る（看）という視線・判断が対象から外れてしまい、鑑定や人物評価を誤る結果を表す"}, "en": {"m": "to misjudge, to be a poor judge of value or character", "i": "走 means 'to stray off course' — the act of looking (看) veers off target, so the resulting appraisal turns out wrong"}, "ex": "這位收藏家難得看走眼，誤把贗品當成真跡收購。"}, {"h": "跑遍", "p": "pǎo biàn", "ja": {"m": "走り回る、隅々まで回る", "i": "「遍」は「もれなく全体に及ぶ」を表し、走る（跑）という動作が対象範囲のすべての場所を網羅した結果を示す"}, "en": {"m": "to run all over, to cover every place (on foot)", "i": "遍 marks 'leaving nothing out' — the running (跑) sweeps across every single spot within the range"}, "ex": "為了找失蹤的愛犬，他跑遍了社區附近的每一條巷子。"}, {"h": "找遍", "p": "zhǎo biàn", "ja": {"m": "くまなく探す、隅々まで探し回る", "i": "「遍」の用法は同じく、探す（找）という動作が対象範囲を一つも漏らさず網羅したことを表す"}, "en": {"m": "to search everywhere, to look high and low", "i": "same 遍 logic as 跑遍 — the searching (找) leaves not a single spot uncovered"}, "ex": "鑰匙找遍了整間屋子，沒想到最後竟然是在口袋裡。"}, {"h": "說漏嘴", "p": "shuō lòu zuǐ", "ja": {"m": "うっかり口を滑らせる、口が滑る", "i": "「漏」は「漏れる」の意で、話す（說）という行為の中で、隠すべき情報が口から水のように漏れ出てしまう結果を表す"}, "en": {"m": "to blurt out, to let something slip while talking", "i": "漏 means 'to leak' — while talking (說) a secret seeps out through the mouth like water through a crack, unintended"}, "ex": "他喝多了幾杯，一不小心就把併購計畫說漏嘴了。"}, {"h": "哭醒", "p": "kū xǐng", "ja": {"m": "泣いて目が覚める", "i": "「醒」は眠りから覚める結果を表し、泣く（哭）という感情の爆発が睡眠状態を突き破り、覚醒に至らせることを示す"}, "en": {"m": "to wake (oneself) up crying", "i": "醒 marks the result of returning to consciousness — the crying (哭) is intense enough to break through sleep and jolt the person awake"}, "ex": "孩子半夜做了惡夢，哭醒之後久久無法再入睡。"}, {"h": "想通", "p": "xiǎng tōng", "ja": {"m": "納得する、吹っ切れる、考えが通る", "i": "「通」は「つながる、通り抜ける」の意で、考える（想）という行為が心の中の「つかえ」を突き抜けさせ、迷いを解消する結果を表す"}, "en": {"m": "to come to terms with something, to work it out mentally", "i": "通 means 'to get through, unblocked' — the thinking (想) breaks through a mental knot, clearing away confusion or resentment"}, "ex": "他失戀了一整年，最近終於想通，決定重新開始生活。"}],intro:{"zh": "由「動詞＋動詞」組成，第二個動詞轉化為結果補語，說明第一個動作的結果。", "ja": "「動詞＋動詞」の組み合わせで、後ろの動詞が結果補語化し、前の動作の結果を説明します。", "en": "A verb followed by a second verb that has become a result complement, describing the outcome of the first action."}},
{id:"adur",name:"時量補語",short:"時量",color:"var(--c-duration)",tint:"var(--c-duration-tint)",cards:[{"h": "有生之年", "p": "yǒu shēng zhī nián", "ja": {"m": "生涯、生きている間", "i": "「生を有する年」の意で、ある願いや行為が「人生の終わりまで続く」という、個人にとって極限の時量を表す"}, "en": {"m": "for as long as one lives, in one's remaining years", "i": "literally 'the years one still possesses life' — it marks the outer limit of a personal duration, stretching to the very end of one's life"}, "ex": "他最大的心願，就是能在有生之年親眼看到人類登陸火星。"}, {"h": "有史以來", "p": "yǒu shǐ yǐ lái", "ja": {"m": "有史以来、歴史上", "i": "「史が有って以来」の意で、人類の記録が始まってから現在までという、時間軸上最大級の時量を基準として補足する"}, "en": {"m": "since records began, the most ~ in (recorded) history", "i": "literally 'since history existed' — it supplies the largest possible span of time as the yardstick, from the dawn of records to now"}, "ex": "這是該地區有史以來最嚴重的一次乾旱。"}, {"h": "歷時", "p": "lì shí", "ja": {"m": "〜の期間を経る、〜かけて（行われる）", "i": "「歷」は「経過する」の意で、後ろに時量を直接伴い、出来事がその長さの時間をまるごと経過したことを表す"}, "en": {"m": "to span/last (a given length of time)", "i": "歷 means 'to pass through' — the duration that follows names exactly how much time the event traveled through from start to finish"}, "ex": "這項考古挖掘工程歷時十年，終於在去年完工。"}, {"h": "耗時", "p": "hào shí", "ja": {"m": "（〜の時間を）費やす、〜かかる", "i": "「耗」は「消耗する」の意で、後ろの時量がその作業のために「使い果たされた」時間の量であることを強調する"}, "en": {"m": "to take up, to consume (a given amount of time)", "i": "耗 means 'to use up' — the duration that follows emphasizes time spent or expended, often implying cost or effort"}, "ex": "這份研究報告耗時三個月才完成初稿。"}, {"h": "餘生", "p": "yú shēng", "ja": {"m": "余生、残りの人生", "i": "「餘」は「残り」の意で、ある出来事以降に残された「人生全体の時間」を一つのまとまった時量として表す"}, "en": {"m": "the remainder of one's life", "i": "餘 means 'leftover' — it bundles everything left of a person's life, from a turning point onward, into a single span of time"}, "ex": "退休之後，他打算在鄉下度過餘生。"}, {"h": "長達", "p": "cháng dá", "ja": {"m": "〜にも及ぶ、長きにわたる", "i": "「達」は「到達する」の意で、期間の長さがことさら強調すべき驚くべき数値にまで「達している」ことを示す誇張的な時量表現"}, "en": {"m": "lasting as long as, spanning (an emphatically long duration)", "i": "達 means 'to reach' — it frames the duration as reaching all the way up to a striking, emphasized length"}, "ex": "這起貪污案纏訟長達十五年，至今仍未定讞。"}, {"h": "為期", "p": "wéi qī", "ja": {"m": "期間を〜とする、〜間の予定で", "i": "「期」は「期間・任期」の意で、計画やイベントが「その長さを一つの区切られた期間として定める」ことを示す"}, "en": {"m": "scheduled to last, set for a period of", "i": "期 means 'term/period' — it fixes an event's duration as a defined, planned span rather than an open-ended one"}, "ex": "這場為期一週的國際影展，吸引了大批影迷前來朝聖。"}],intro:{"zh": "表示動作或狀態持續的高階、書面時間長度，常見於報導與正式敘述。", "ja": "動作や状態が続いた高度な・書面語的な時間の長さを表します。報道や正式な文章でよく使われます。", "en": "Advanced, literary expressions of how long an action or state lasted — common in reports and formal narration."}},
{id:"afreq",name:"動量補語",short:"動量",color:"var(--c-frequency)",tint:"var(--c-frequency-tint)",cards:[{"h": "一番", "p": "yī fān", "ja": {"m": "（思考・議論などの）ひとしきり、一通り", "i": "「番」は出来事の「一巡り」を数える量詞で、単純な回数ではなく、思考や議論などの複雑なプロセス全体を一区切りとして数える"}, "en": {"m": "a whole bout/spell of (thinking, arguing, effort)", "i": "番 counts a full 'round' of an event — not a tally of times, but an entire elaborate process like deliberation or debate treated as one unit"}, "ex": "經過一番激烈的辯論，委員會終於做出最終決議。"}, {"h": "一遭", "p": "yī zāo", "ja": {"m": "（人生の巡り合わせとしての）一度、一巡り", "i": "「遭」は「巡り合う、出くわす」の意で、人生における滅多にない体験や運命的な出来事を一つの節目として数える文語的な動量詞"}, "en": {"m": "one time round (of a rare, fateful life experience)", "i": "遭 means 'to encounter' — it counts a rare, fateful passage through life as a single lap, often in the phrase 走一遭"}, "ex": "既然來這世上走一遭，凡事都不該留下遺憾。"}, {"h": "一瞥", "p": "yī piē", "ja": {"m": "（書面語）ちらりと見ること、一瞥", "i": "「瞥」自体が「ちらっと見る」という一瞬の動作を表す語で、「一瞥」はその一回性を強調した、口語「看一眼」の書面語版"}, "en": {"m": "a glance, a glimpse (literary)", "i": "瞥 itself means 'to glance fleetingly' — pairing it with 一 crystallizes that instant into the literary counterpart of spoken 看一眼"}, "ex": "她只匆匆一瞥，便認出了人群中的老同學。"}, {"h": "一例/一宗", "p": "yī lì / yī zōng", "ja": {"m": "（事件・症例などの）一件", "i": "「例」「宗」はともに事件・症例・案件を数える書面語の量詞で、ニュースや法律・医学分野で一つの事案を格式高く数える"}, "en": {"m": "one case/instance (of an event, legal case, or medical case)", "i": "both 例 and 宗 are formal classifiers for a single 'case' — used in news, legal, or medical registers to tally an incident with official weight"}, "ex": "醫院通報新增一例罕見病毒感染，法院則受理了一宗重大貪污案。"}, {"h": "一撞", "p": "yī zhuàng", "ja": {"m": "ぶつかる一回、一撞き", "i": "「撞」は「ぶつかる、突き当たる」動作を表し、「一撞」でその衝撃が一回の出来事として起こったことを強調する叙述的な動量詞"}, "en": {"m": "one collision/impact (a single, forceful bump)", "i": "撞 means 'to crash into' — 一撞 freezes that impact as a single dramatic event, often marking the decisive moment in a narrative"}, "ex": "卡車煞車失靈衝上安全島，狠狠一撞便撞垮護欄。"}, {"h": "驚鴻一瞥", "p": "jīng hóng yī piē", "ja": {"m": "一瞬だけ見た、忘れられない美しい姿", "i": "「驚鴻（飛び立つ美しい白鳥）」を「一瞥」しただけという成語で、一瞬しか見えなかったからこそ強く印象に焼き付くことを表す"}, "en": {"m": "a fleeting, unforgettable glimpse (of someone or something beautiful)", "i": "literally 'a single glance at a startled swan in flight' — the very brevity of that one glimpse is what burns the beautiful image into memory"}, "ex": "記者會上，她驚鴻一瞥的身影，成了隔天媒體的頭條。"}],intro:{"zh": "表示動作進行的高階、書面次數或情態，常帶有文學色彩。", "ja": "動作が行われた高度な・書面語的な回数や様子を表し、文学的な色合いを帯びることが多いです。", "en": "Advanced, literary ways to count how many times (or in what manner) an action occurred — often with a literary flavor."}}
];

②","prompt":"關於這位物理學家剽竊爭議的真相，文中提到後來發生了什麼事？","options":["真相隨著私人信件曝光而完全公開，水落石出","真相至今仍然成謎，沒有人知道答案","當事人在生前親自出面澄清了所有疑慮","相關單位下令永久封存所有調查資料"],"correct":0,"cat":"ares"}]},{"context":"十年前，這片沿海濕地因為工業污染而魚蝦絕跡，當地一群退休教師自發組成保育團隊，致力於復育原生紅樹林與底棲生物。起初，團隊嘗試的人工復育方法屢屢失敗，第一階段的移植計畫最終以幼苗大量枯死告終，讓志工們一度心灰意冷。所幸經過反覆調整栽種方式與監測水質，新一輪的復育策略終於奏效，如今濕地已重新出現招潮蟹與白鷺鷥的蹤跡。","items":[{"label":"①","prompt":"這群退休教師組成保育團隊之後，主要投入了什麼工作？","options":["全心投入濕地生態的復育，包括紅樹林與底棲生物","向政府陳情要求關閉附近所有工廠","訓練當地居民從事觀光導覽","研發能夠淨化污水的新型機器"],"correct":0,"cat":"ares"},{"label":"②","prompt":"文中「以幼苗大量枯死告終」的意思是？","options":["這項計畫最後的結果是幼苗大量死亡，以失敗收場","幼苗雖然大量死亡，但計畫仍持續進行中","這項計畫尚未開始執行","幼苗大量死亡後，團隊立刻獲得政府補助"],"correct":0,"cat":"ares"},{"label":"③","prompt":"根據文章，後來濕地復育出現什麼轉機？","options":["調整栽種方式與監測水質後，新策略終於發揮效果，生態逐漸恢復","政府直接介入接管了整個復育計畫","志工們決定放棄復育，轉而發展觀光","工廠主動關閉，污染源徹底消失"],"correct":0,"cat":"ares"}]},{"context":"這本新出版的散文集，文字看似平淡，實則用字精準，每一個形容詞的分量都拿捏得恰到好處，絕不誇張也不過分節制。作者描寫童年老家後院的那段文字尤其令人印象深刻，祖母搖著蒲扇、貓咪懶洋洋趴在門檻上的畫面彷彿躍然紙上，讓讀者彷彿身歷其境。","items":[{"label":"①","prompt":"文中「拿捏得恰到好處」是指？","options":["分寸掌握得剛剛好，不多不少、不誇張也不過分保守","過度誇張、用詞浮誇","完全沒有修飾、平鋪直敘","還沒抓到重點，有待加強"],"correct":0,"cat":"ares"},{"label":"②","prompt":"文中「彷彿躍然紙上」形容的是？","options":["描寫生動逼真，畫面彷彿就在眼前活了過來","文字內容艱澀難懂，讀者難以理解","書本紙質精美，印刷十分講究","情節發展平淡，缺乏起伏"],"correct":0,"cat":"ares"}]},{"context":"昨晚這場規模六點八的強震，震央雖然位於外海，但強烈的搖晃仍傷及市區多棟老舊建築，造成三人受傷送醫。氣象單位也提醒，接下來幾天可能出現多次餘震，災情恐將波及到鄰近的兩個縣市，呼籲民眾提高警覺，做好防災準備。","items":[{"label":"①","prompt":"文中「傷及市區多棟老舊建築」的意思是？","options":["讓市區多棟老舊建築遭受破壞，也造成有人因此受創","讓市區的建築變得更加堅固","只影響了郊區，市區完全沒有損失","建築物完好無損，只是外觀受到驚嚇"],"correct":0,"cat":"ares"},{"label":"②","prompt":"文中提到，接下來的餘震可能會有什麼影響？","options":["災情可能會擴大，連帶影響到附近的兩個縣市","餘震只會發生在原本的震央附近，不會有其他影響","政府已經確定不會再有餘震發生","鄰近縣市的災情比市區更加嚴重"],"correct":0,"cat":"ares"}]},{"context":"這部紀錄片跟拍了一個礦工家庭三代人的生活，鏡頭語言樸實卻極具張力，完整呈現出台灣礦業由盛轉衰的歷程。片中幾段訪談也意外暴露出當年礦場安全檢查形同虛設的真相，讓觀眾看得怵目驚心。導演坦言，他其實是想藉由這個小家庭的悲歡，折射出整個世代勞工被時代巨輪輾過的共同命運。","items":[{"label":"①","prompt":"文中「完整呈現出台灣礦業由盛轉衰的歷程」是指？","options":["清楚地展示出台灣礦業從興盛走向衰落的整個過程","完全省略了台灣礦業曾經興盛的部分","只討論礦業衰落後的補償問題","誇大了礦業實際的發展規模"],"correct":0,"cat":"adir"},{"label":"②","prompt":"片中的訪談內容讓觀眾發現了什麼？","options":["當年礦場的安全檢查其實只是做做樣子，並未落實","礦工當年的薪水其實遠高於外界想像","礦場的安全紀錄一直保持良好","訪談對象大多不願意透露真實想法"],"correct":0,"cat":"adir"},{"label":"③","prompt":"文中「折射出整個世代勞工……共同命運」的意思最接近？","options":["間接反映出、映照出那個世代勞工共通的處境","完全歪曲、扭曲了勞工的真實處境","刻意忽略了勞工階層的存在","直接列出所有礦工的姓名與資料"],"correct":0,"cat":"adir"}]},{"context":"這次員工滿意度調查的結果，把公司內部溝通不良的問題徹底凸顯出來，近六成員工表示主管交辦任務時經常語焉不詳。人資長在檢討會議上強調，新訂定的『透明溝通準則』無論遇到多少阻力，都必須從高層到基層貫徹下去，絕不能虎頭蛇尾，否則企業文化改革終將淪為空談。","items":[{"label":"①","prompt":"文中「把……問題徹底凸顯出來」是指？","options":["讓原本不明顯的問題變得十分清楚、引人注意","讓原本嚴重的問題徹底消失","刻意掩蓋問題，不讓外界知道","把問題的責任推給基層員工"],"correct":0,"cat":"adir"},{"label":"②","prompt":"人資長對於「透明溝通準則」有什麼要求？","options":["不論遇到多大阻力，都要從高層到基層徹底落實、堅持到底","只要基層員工遵守就好，高層可以不受約束","可以視情況隨時調整或暫停執行","先在部分部門試辦，成效不佳就取消"],"correct":0,"cat":"adir"}]},{"context":"台灣的手搖飲文化，最早只是街邊幾家小攤販賣的清涼飲品，後來隨著連鎖加盟制度的成熟，才逐漸推廣開來，如今幾乎每條街都能看到手搖飲店的蹤影。然而，近年來另一股風氣也悄悄蔓延開來——不少店家為了搶快，開始使用劣質果糖與香精，食安問題頻傳。學者分析，這種從強調天然食材到追求成本壓縮的轉變，其實是市場過度競爭之下，長期演變下來的必然結果。","items":[{"label":"①","prompt":"文中「才逐漸推廣開來」的意思是？","options":["逐漸普及、傳開到台灣各地，越來越多人接觸得到","逐漸消失、乏人問津","只在少數幾個城市流行，始終沒有擴大","被政府明令禁止販售"],"correct":0,"cat":"adir"},{"label":"②","prompt":"文中提到，近年手搖飲業出現了什麼隱憂？","options":["部分店家為了降低成本，使用劣質原料，導致食安問題逐漸擴散","手搖飲店數量開始大幅減少","消費者對手搖飲的需求完全消失","政府已經徹底解決了所有食安問題"],"correct":0,"cat":"adir"},{"label":"③","prompt":"文中「長期演變下來的必然結果」是指？","options":["經過長時間一步步轉化、發展才形成的結果","一夕之間突然發生的意外結果","完全依照最初計畫發展的結果","與市場競爭毫無關聯的巧合"],"correct":0,"cat":"adir"}]},{"context":"林師傅在夜市擺麵攤已經二十年了。上個月他母親突然中風住院，需要人日夜照顧，他一度想收攤不做，但轉念一想，這攤子是老顧客們多年來捧場才撐起來的，做生意最重要的就是要對得起良心，也要對得起每一位掏錢捧場的老客人。於是他請了一位工讀生幫忙顧攤，自己白天去醫院照顧母親，晚上再趕回來掌廚，忙得連好好吃一頓飯、睡一場整覺都顧不得了。即使如此，他仍堅持湯頭不能偷工減料，「這陣子生意做得不算頂好，但至少過得去，客人吃得滿意，我心裡才踏實。」他這麼說。","items":[{"label":"①","prompt":"根據這段文字，林師傅為什麼在母親生病後仍堅持不收掉麵攤？","options":["因為他覺得對得起客人的長期支持比自己方便更重要","因為工讀生的薪水太低，收攤不划算","因為母親要求他無論如何都要繼續營業","因為他認為自己過得去，不需要別人幫忙"],"correct":0,"cat":"apot"},{"label":"②","prompt":"文中「顧不得」意思最接近下列何者？","options":["忙到根本沒有餘裕去在意、處理那些事","完全不在乎那些事情，認為不重要","已經妥善安排好那些事情，不用擔心","故意忽略那些事，藉此偷懶"],"correct":0,"cat":"apot"},{"label":"③","prompt":"文中林師傅說「生意…至少過得去」，這句話最符合下列哪一個意思？","options":["生意雖稱不上興隆，但也還能維持基本的水準，不算太差","生意其實非常興隆，賺了不少錢","生意已經差到快要倒閉的地步","生意好壞他完全不在乎，隨緣就好"],"correct":0,"cat":"apot"}]},{"context":"表哥最近想拉我一起投資一間手搖飲加盟店，他說評估過附近的人流和租金，這個地段開店「划得來」，兩三年就能回本。可是我打聽了一下，這家加盟總部去年才剛換過兩次負責人，財務狀況一直不透明，聽起來實在不太靠得住。我把這些疑慮告訴表哥，他卻堅持自己蒐集的市調數據經得起考驗，認為只是同業放的謠言，不必理會。我心裡仍然七上八下——如果加盟總部真的說垮就垮，我們這筆錢恐怕就打水漂了。","items":[{"label":"①","prompt":"「我」對這樁投資最主要的疑慮是什麼？","options":["加盟總部的經營穩定性和財務透明度令人不放心","表哥沒有做任何市場調查就決定投資","手搖飲的口味已經退流行，不再受歡迎","這個地段的租金太貴，開店根本不划算"],"correct":0,"cat":"apot"},{"label":"②","prompt":"文中表哥說這個地段開店「划得來」，意思是什麼？","options":["以目前評估的成本和報酬來看，這筆投資值得，能夠回本獲利","這個地段目前正在特價出租，租金比市價便宜許多","這個地段的交通非常便利，開車或搭車都很方便","這筆投資風險太高，怎麼算都不值得去做"],"correct":0,"cat":"apot"},{"label":"③","prompt":"文中「經得起考驗」是指表哥認為自己的市調數據如何？","options":["有憑有據、合理可信，就算被質疑或深入檢查也不會出問題","只是他個人主觀的猜測，缺乏任何根據","數據雖然好看，但其實是他捏造出來的假資料","那些數據已經過時，早就不適用於現在的市場"],"correct":0,"cat":"apot"}]},{"context":"表姊在急診室當護理師五年了，值大夜班、面對生死交關的場面早已是家常便飯。有人問她：「這種高壓的工作環境，你怎麼受得了？」她笑著說，剛入行前半年幾乎天天以淚洗面、也懷疑過自己是不是選錯了行業，但後來想通了：既然選擇了這條路，就要對得起病人的信任。同事都說，像她這樣在高壓崗位上堅持五年、始終保持耐心與溫柔的人，實在難能可貴。至於她提出改善輪班制度的建議，護理長也認為理由充分、站得住腳，已經著手研議調整方案。","items":[{"label":"①","prompt":"根據文章，表姊剛入行時的心情與後來的轉變是什麼？","options":["一開始也曾經難以承受、甚至想過放棄，後來因為想通而堅持下來","她從一開始就完全樂在其中，從未感到辛苦","她因為受不了工作壓力，最後轉調到其他部門","她認為急診室的工作其實比想像中輕鬆許多"],"correct":0,"cat":"apot"},{"label":"②","prompt":"文中同事稱讚表姊「難能可貴」，這是什麼意思？","options":["這種事很不容易做到，因此格外值得珍惜與讚賞","這種事雖然普通，但態度還算及格","這種能力是與生俱來的天賦，不需要努力","這種行為其實隱藏著不可告人的動機"],"correct":0,"cat":"aidiom"},{"label":"③","prompt":"文中提到表姊的建議「站得住腳」，意思最接近？","options":["論點合理充分，能夠成立、不怕被推翻","建議內容其實模糊不清，尚待補充說明","建議雖然立意良好，但缺乏具體可行性","護理長基於人情才勉強採納這項建議"],"correct":0,"cat":"aidiom"}]},{"context":"去年秋天，我到日本京都自助旅行，傍晚時分獨自走到嵐山的渡月橋上，正好遇上滿山楓紅倒映在河面上，夕陽餘暉灑落，景色美不可言，讓我一時忘了拿起相機，只是靜靜站著看了好久。就在這時，身旁一位素未謀面的旅人也被眼前的畫面感動，情不自禁地讚嘆出聲，我們相視一笑，聊了起來，才知道彼此都是獨自旅行的背包客。後來她告訴我，她正巧在找同行夥伴一起走接下來的旅程，對我這個剛好也沒有既定行程的人來說，這真是求之不得的邀約，於是我們便結伴走完了接下來三天的關西之旅。","items":[{"label":"①","prompt":"文中「美不可言」用來形容眼前的景色如何？","options":["美到讓人幾乎找不到合適的詞語來形容","美則美矣，但其實沒有想像中那麼特別","景色很美，但夾雜著淡淡的哀傷與遺憾","那裡的美景其實只是商業廣告誇大宣傳"],"correct":0,"cat":"aidiom"},{"label":"②","prompt":"文中那位旅人「情不自禁地讚嘆出聲」，是什麼意思？","options":["因為內心受到觸動，不由自主地脫口而出","刻意提高音量，想引起周圍人的注意","出於禮貌，勉強擠出幾句稱讚的話","因為看不懂眼前的景象，忍不住發問"],"correct":0,"cat":"aidiom"},{"label":"③","prompt":"對「我」來說，那位旅人提出結伴同行的邀約，是什麼樣的心情？","options":["正合心意，簡直是意外而難得的好機會","有些勉強，但礙於禮貌不好意思拒絕","感到困擾，因為原本已經有其他旅伴","覺得對方另有目的，因此有所保留"],"correct":0,"cat":"aidiom"}]},{"context":"這座矗立在山巔的古堡，城牆以巨石堆砌而成，歷經數百年的戰火與地震仍屹立不搖，當地人都說它堅不可摧，從未真正被攻破過。然而考古學家始終百思不得其解的是，城堡地底那條神秘通道究竟通往何處，至今仍是未解之謎。傳說中，曾有登山客在濃霧散去的瞬間，於城堡最高處驚鴻一瞥地看見一道白色身影，隨即又被霧氣籠罩，消失無蹤，此後便再也沒有人親眼見過。","items":[{"label":"①","prompt":"文中「堅不可摧」形容這座古堡的城牆具有什麼特質？","options":["極為堅固，任憑外力攻擊或天災都難以破壞","外觀雖然堅硬，但其實內部結構早已腐朽","建造工法特殊，因此造價十分昂貴","城牆表面粗糙，缺乏美觀的裝飾設計"],"correct":0,"cat":"aidiom"},{"label":"②","prompt":"文中「百思不得其解」是指考古學家對通道的去向感到？","options":["無論怎麼推敲研究，都始終找不出合理的答案","完全不感興趣，認為不值得深入研究","已經找到答案，只是尚未對外公開","認為答案顯而易見，不需要多加思考"],"correct":0,"cat":"aidiom"},{"label":"③","prompt":"文中登山客「驚鴻一瞥」看見白色身影，這個詞強調的是什麼？","options":["只在極短暫的瞬間看見，畫面美麗卻稍縱即逝、令人難忘","那道身影其實是登山客自己的錯覺，並非真實存在","登山客長時間盯著那個方向，仔細確認了很久","那道身影每天都固定出現，已經不算罕見"],"correct":0,"cat":"afreq"}]},{"context":"爺爺今年九十歲了，年輕時因戰亂被迫離開故鄉，從此再也沒能回去。這些年來，他常常望著窗外喃喃自語：「不知道有生之年，還能不能再看一眼老家門口那棵大榕樹。」上個月，兩岸開放了睽違已久的探親專案，堂哥主動幫爺爺報名，說什麼也要圓他這個心願。出發前，爺爺激動地說，這趟旅程恐怕是他餘生最重要的一件事了。新聞報導這次專案時也提到，開放探親的規模是有史以來最大的一次，超過十萬名旅客申請同行。","items":[{"label":"①","prompt":"爺爺說「有生之年」希望再看一眼老家的榕樹，這句話透露出什麼樣的心情？","options":["擔心自己來日不多，希望能在死前完成這個心願","認為自己還很年輕，這件事完全不急著做","對故鄉已經沒有任何情感，只是隨口說說","希望晚輩代替自己回去看看就好，自己不必親自前往"],"correct":0,"cat":"adur"},{"label":"②","prompt":"文中爺爺說這趟旅程是他「餘生」最重要的一件事，「餘生」是指？","options":["一個人往後所剩、尚未走完的日子","已經度過、無法追回的過去歲月","一整年當中最後剩下的那幾個月","因債務等因素被迫延長工作的時間"],"correct":0,"cat":"adur"},{"label":"③","prompt":"新聞報導提到這次探親規模是「有史以來」最大的一次，這個詞是什麼意思？","options":["從有記載的歷史開始到現在，從來沒有過的（程度）","只是最近幾年當中數一數二的規模","依照法律規定所限定的最高上限人數","相較於去年同期，成長了將近一倍"],"correct":0,"cat":"adur"}]}]};

try{
  var saved = window.localStorage && localStorage.getItem("buyu-script");
  if(saved === "trad" || saved === "simp") state.script = saved;
}catch(e){}

function tt(str){ return state.script === "simp" ? toS(str) : str; }

function findCat(id){
  for(var i=0;i<CATEGORIES.length;i++){ if(CATEGORIES[i].id===id) return CATEGORIES[i]; }
  for(var j=0;j<CATEGORIES3.length;j++){ if(CATEGORIES3[j].id===id) return CATEGORIES3[j]; }
  return null;
}

function go(screen, extra){
  state.screen = screen;
  if(extra) for(var k in extra) state[k]=extra[k];
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function setScript(s){
  state.script = s;
  try{ window.localStorage && localStorage.setItem("buyu-script", s); }catch(e){}
  render();
}

    left = '<button class="nav-btn" data-nav="studyLang">‹ '+tt('返回')+'</button><span class="crumb">'+tt(moduleZh)+' · '+(state.studyLang==="ja"?tt('中日'):tt('中英'))+'</span>';
  } else if(state.screen === "deck"){
    left = '<button class="nav-btn" data-nav="types">‹ '+tt('返回')+'</button><span class="crumb">'+tt(moduleZh)+' · '+(state.studyLang==="ja"?tt('中日'):tt('中英'))+'</span>';

  } else {

  var right = '<div class="script-toggle" role="group" aria-label="'+tt('繁簡切換')+'">'

    + '</div>';

  if(state.screen === "lang"){ right = ""; }

  var homeBtn = "";
  if(state.screen !== "lang" && state.screen !== "menu"){
    homeBtn = '<button class="nav-btn" data-nav="menu" style="margin-left:2px;">⌂ '+tt('模塊')+'</button>';
  }

/* ============ Render: lookup (module 4) ============ */
function allLookupCards(){
  var out = [];
  CATEGORIES.forEach(function(c){
    c.cards.forEach(function(card){
      out.push({card:card, level:"basic", levelZh:"初級", catName:c.name, color:c.color, tint:c.tint});
    });
  });
  CATEGORIES3.forEach(function(c){
    c.cards.forEach(function(card){
      out.push({card:card, level:"advanced", levelZh:"高級", catName:c.name, color:c.color, tint:c.tint});
    });
  });
  return out;
}

function lookupMatch(h, query){
  var qs = toS(query);
  var variants = h.split("/");
  for(var i=0;i<variants.length;i++){
    if(toS(variants[i]).indexOf(qs) !== -1) return true;
  }
  return false;
}

function screenLookupSearch(){
  var q = state.lookupQuery.trim();
  var body = "";
  if(!q){
    body = '<p class="lookup-hint">'+tt("請輸入想查詢的補語，例如「見」或「得」")+'</p>';
  } else {
    var all = allLookupCards();
    var exact = [], partial = [];
    all.forEach(function(entry){
      if(lookupMatch(entry.card.h, q)){
        if(entry.card.h.split("/").some(function(v){ return toS(v) === toS(q); })) exact.push(entry);
        else partial.push(entry);
      }
    });
    var results = exact.concat(partial);
    if(results.length === 0){
      body = '<p class="lookup-hint">'+tt("沒有找到跟「"+q+"」有關的補語")+'</p>';
    } else {
      body = '<div class="lookup-results">' + results.map(function(entry){
        var card = entry.card;
        var css = '--cat-color:'+entry.color+';--cat-tint:'+entry.tint+';';
        var langBlock = state.studyLang === "ja"
          ? '<div class="back-line"><span class="lbl">本来の意味：</span><span class="val">'+card.ja.m+'</span></div>'
           +'<div class="back-line"><span class="lbl">補語のイメージ：</span><span class="val">'+card.ja.i+'</span></div>'
           +'<div class="back-line example"><span class="lbl">例：</span><span class="val">'+tt(card.ex)+'</span></div>'
          : '<div class="back-line"><span class="lbl">Original meaning: </span><span class="val">'+card.en.m+'</span></div>'
           +'<div class="back-line"><span class="lbl">Image as complement: </span><span class="val">'+card.en.i+'</span></div>'
           +'<div class="back-line example"><span class="lbl">Example: </span><span class="val">'+tt(card.ex)+'</span></div>';
        return ''
        +'<div class="lookup-card" style="'+css+'">'
          +'<div class="lookup-card-head">'
            +'<span class="lookup-hanzi">'+tt(card.h)+'</span>'
            +'<span class="lookup-level-badge">'+tt(entry.levelZh)+'</span>'
          +'</div>'
          +'<div class="pinyin lookup-pinyin">'+card.p+'</div>'
          +'<span class="lookup-cat-pill" style="color:'+entry.color+';background:'+entry.tint+';">'+tt(entry.catName)+'</span>'
          +'<div class="back-lines">'+langBlock+'</div>'
        +'</div>';
      }).join("") + '</div>';
    }
  }
  return ''
  +'<div class="section-head">'
    +'<h2>'+tt("查詢")+'</h2>'
    +'<p>'+tt("輸入補語，立刻查看初級與高級所有相關的學習卡")+'</p>'
  +'</div>'
  +'<div class="lookup-search-wrap">'
    +'<input type="text" id="lookupInput" class="lookup-input" placeholder="'+tt('輸入補語，例如「見」')+'" value="'+(state.lookupQuery||"").replace(/"/g,"&quot;")+'" autocomplete="off">'
  +'</div>'
  + body;
}

function findPType(id){

  for(var j=0;j<PRACTICE_TYPES3.length;j++){ if(PRACTICE_TYPES3[j].id===id) return PRACTICE_TYPES3[j]; }

}

  +'<div class="type-grid">'+cards+'</div>';

function buildPracticeSets(typeId, shuffle){
  var raw = PRACTICE[typeId] || PRACTICE3[typeId];
  var order = raw.map(function(_,i){return i;});
  if(shuffle) order = shuffleArr(order);
  return order.map(function(i){ return raw[i]; });
}

function startPractice(typeId, shuffle){
  var sets = buildPracticeSets(typeId, shuffle);
  var total = sets.reduce(function(sum,s){ return sum + s.items.length; }, 0);
  go("practiceQuiz", {
    practiceTypeId: typeId,
    practiceSets: sets,
    setIdx: 0,
    answers: new Array(sets[0].items.length).fill(null),
    checked: false,
    practiceScore: 0,
    practiceTotal: total,
    practiceWrong: []
  });
}

function screenPracticeQuiz(){
  var pt = findPType(state.practiceTypeId);
  var sets = state.practiceSets;
  var set = sets[state.setIdx];
  var qNumBefore = sets.slice(0, state.setIdx).reduce(function(s,x){return s+x.items.length;},0);
  var css = '--cat-color:var(--accent);--cat-tint:var(--accent-tint);';

  var passageHtml = set.context ? '<div class="quiz-passage">'+tt(set.context)+'</div>' : '';

  var itemsHtml = set.items.map(function(item, i){
    var label = item.label ? '<span class="q-label">'+item.label+'</span>' : '';
    var promptTxt = item.prompt ? tt(item.prompt) : '';
    var optsHtml = item.options.map(function(opt, oi){
      var cls = "opt-btn";
      var sel = state.answers[i] === oi;
      if(sel) cls += " selected";
      if(state.checked){
        if(oi === item.correct) cls += " is-correct";
        else if(sel && oi !== item.correct) cls += " is-wrong";
      }
      var mark = String.fromCharCode(65+oi);
      return '<button class="'+cls+'" data-item="'+i+'" data-opt="'+oi+'" '+(state.checked?"disabled":"")+'>'
        + '<span class="opt-mark">'+mark+'</span><span>'+tt(opt)+'</span>'
        + '</button>';
    }).join("");
    return '<div class="quiz-item">'
      + (label || promptTxt ? '<div class="q-prompt">'+label+'<span>'+promptTxt+'</span></div>' : '')
      + '<div class="opt-list">'+optsHtml+'</div>'
      + '</div>';
  }).join("");

  var allAnswered = state.answers.every(function(a){ return a !== null; });
  var isLastSet = state.setIdx === sets.length - 1;

  var actionHtml;
  if(!state.checked){
    actionHtml = '<div class="quiz-actions"><button class="pill-btn primary" id="checkBtn" '+(allAnswered?"":"disabled")+'>'+tt("檢查答案")+'</button></div>';
  } else {
    actionHtml = '<div class="quiz-actions"><button class="pill-btn primary" id="nextSetBtn">'+(isLastSet?tt("看結果"):tt("下一題"))+'</button></div>';
  }

  return ''
  +'<div class="quiz-headrow" style="'+css+'">'
    +'<span class="cat-pill"><span class="dot"></span>'+tt(pt.zh)+'</span>'
    +'<div class="progress-wrap">'
      +'<span>'+(qNumBefore+1)+'–'+(qNumBefore+set.items.length)+' / '+state.practiceTotal+'</span>'
      +'<span class="progress-track"><span class="progress-fill" style="width:'+Math.round((qNumBefore/state.practiceTotal)*100)+'%;"></span></span>'
    +'</div>'
  +'</div>'
  +'<div class="quiz-shell">'+passageHtml+itemsHtml+actionHtml+'</div>';
}

/* ============ main render ============ */
function render(){
  document.body.classList.toggle("script-simp", state.script === "simp");
  renderTopbar();
  var app = document.getElementById("app");
  if(state.screen === "lang") app.innerHTML = screenLang();
  else if(state.screen === "menu") app.innerHTML = screenMenu();
  else if(state.screen === "masteryHome") app.innerHTML = screenMasteryHome();
  else if(state.screen === "studyLang") app.innerHTML = screenStudyLang();
  else if(state.screen === "lookupSearch") app.innerHTML = screenLookupSearch();
  else if(state.screen === "types") app.innerHTML = screenTypes();
  else if(state.screen === "deck") app.innerHTML = screenDeck();
  else if(state.screen === "practiceTypes") app.innerHTML = screenPracticeTypes();
  else if(state.screen === "practiceQuiz") app.innerHTML = screenPracticeQuiz();
  else if(state.screen === "practiceDone") app.innerHTML = screenPracticeDone();
  bindScreenEvents();
}

function shuffleArr(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function bindScreenEvents(){
  var app = document.getElementById("app");

  // lang screen
  app.querySelectorAll("[data-script]").forEach(function(el){
    el.addEventListener("click", function(){
      setScript(el.getAttribute("data-script"));
      go("menu");
    });
  });

  // menu screen
  app.querySelectorAll("[data-module]").forEach(function(el){
    el.addEventListener("click", function(){
      if(el.getAttribute("data-active") !== "true") return;
      var id = el.getAttribute("data-module");
      if(id === "study") go("studyLang", {moduleCtx:"base"});
      else if(id === "practice") go("practiceTypes", {moduleCtx:"base"});
      else if(id === "mastery") go("masteryHome", {moduleCtx:"mastery"});
      else if(id === "lookup") go("studyLang", {moduleCtx:"lookup", lookupQuery:""});
    });
  });

  // masteryHome screen: cards / practice sub-cards
  app.querySelectorAll("[data-mastery-sub]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-mastery-sub");
      if(id === "cards") go("studyLang", {moduleCtx:"mastery"});
      else if(id === "practice") go("practiceTypes", {moduleCtx:"mastery"});
    });
  });

  // practice: type picker
  app.querySelectorAll("[data-ptype]").forEach(function(el){
    el.addEventListener("click", function(){
      startPractice(el.getAttribute("data-ptype"), false);
    });
  });

  // practice: quiz option select
  app.querySelectorAll(".opt-btn").forEach(function(el){
    el.addEventListener("click", function(){
      if(state.checked) return;
      var i = parseInt(el.getAttribute("data-item"), 10);
      var oi = parseInt(el.getAttribute("data-opt"), 10);
      state.answers[i] = oi;
      render();
    });
  });

  // practice: check answers
  var checkBtn = document.getElementById("checkBtn");
  if(checkBtn) checkBtn.addEventListener("click", function(){
    var set = state.practiceSets[state.setIdx];
    set.items.forEach(function(item, i){
      var chosen = state.answers[i];
      if(chosen === item.correct){
        state.practiceScore++;
      } else {
        state.practiceWrong.push({
          prompt: (set.context ? (item.label||"") + " " + (item.prompt||"") : item.prompt),
          yourText: item.options[chosen],
          correctText: item.options[item.correct]
        });
      }
    });
    state.checked = true;
    render();
  });

  // practice: next set / see results
  var nextSetBtn = document.getElementById("nextSetBtn");
  if(nextSetBtn) nextSetBtn.addEventListener("click", function(){
    if(state.setIdx < state.practiceSets.length - 1){
      state.setIdx++;
      state.answers = new Array(state.practiceSets[state.setIdx].items.length).fill(null);
      state.checked = false;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    } else {
      go("practiceDone");
    }
  });

  // practice: retry
  var retryBtn = app.querySelector("[data-retry]");
  if(retryBtn) retryBtn.addEventListener("click", function(){
    startPractice(state.practiceTypeId, false);
  });

  // study lang screen
  app.querySelectorAll("[data-studylang]").forEach(function(el){
    el.addEventListener("click", function(){
      var lang = el.getAttribute("data-studylang");
      if(state.moduleCtx === "lookup") go("lookupSearch", {studyLang: lang});
      else go("types", {studyLang: lang});
    });
  });

  // lookup screen: search input (IME-safe re-render)
  var lookupInput = document.getElementById("lookupInput");
  if(lookupInput){
    var composing = false;
    lookupInput.addEventListener("compositionstart", function(){ composing = true; });
    lookupInput.addEventListener("compositionend", function(){
      composing = false;
      state.lookupQuery = lookupInput.value;
      render();
    });
    lookupInput.addEventListener("input", function(){
      state.lookupQuery = lookupInput.value;
      if(!composing) render();
    });
    lookupInput.focus();
    var lookupPos = lookupInput.value.length;
    try{ lookupInput.setSelectionRange(lookupPos, lookupPos); }catch(e){}
  }

  // types screen
  app.querySelectorAll("[data-cat]").forEach(function(el){
    el.addEventListener("click", function(){
      var cat = findCat(el.getAttribute("data-cat"));
      var order = cat.cards.map(function(_,i){return i;});
      go("deck", {categoryId: cat.id, order: order, idx:0, flipped:false, shuffled:false});
    });
  });

  // deck screen
  var flip = document.getElementById("flipCard");
  if(flip){
    flip.addEventListener("click", function(){ state.flipped = !state.flipped; render(); });
    flip.addEventListener("keydown", function(ev){
      if(ev.key===" " || ev.key==="Enter"){ ev.preventDefault(); state.flipped=!state.flipped; render(); }
    });
  }
  var flipBtn = document.getElementById("flipBtn");
  if(flipBtn) flipBtn.addEventListener("click", function(ev){ ev.stopPropagation(); state.flipped=!state.flipped; render(); });

  var prevBtn = document.getElementById("prevBtn");
  if(prevBtn) prevBtn.addEventListener("click", function(){
    if(state.idx>0){ state.idx--; state.flipped=false; render(); }
  });
  var nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", function(){
    state.idx++; state.flipped=false; render();
  });
  var shuffleBtn = document.getElementById("shuffleBtn");
  if(shuffleBtn) shuffleBtn.addEventListener("click", function(){
    var cat = findCat(state.categoryId);
    var base = cat.cards.map(function(_,i){return i;});
    state.order = state.shuffled ? base : shuffleArr(base);
    state.shuffled = !state.shuffled;
    state.idx = 0; state.flipped=false;
    render();
  });
  var againBtn = app.querySelector("[data-again]");
  if(againBtn) againBtn.addEventListener("click", function(){
    var cat = findCat(state.categoryId);
    var base = cat.cards.map(function(_,i){return i;});
    state.order = state.shuffled ? shuffleArr(base) : base;
    state.idx = 0; state.flipped=false;
    render();
  });
  app.querySelectorAll("[data-nav]").forEach(function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
  });

  // keyboard nav on deck
  if(state.screen === "deck"){
    document.onkeydown = function(ev){
      if(ev.key==="ArrowRight"){ nextBtn && nextBtn.click(); }
      else if(ev.key==="ArrowLeft"){ prevBtn && !prevBtn.disabled && prevBtn.click(); }
    };
  } else {
    document.onkeydown = null;
  }
}

render();
})();
</script>
