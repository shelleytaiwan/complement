<title>補語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+TC:ital,wght@0,500;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#efe9db;
    --bg-1:#f6f1e5;
    --surface:#fffdf7;
    --surface-2:#f7f0e2;
    --ink:#26303c;
    --ink-soft:#6c6255;
    --ink-faint:#9a8f7d;
    --line:rgba(38,48,60,0.12);
    --accent:#b23a2a;
    --accent-deep:#8a2c1f;
    --accent-tint:#f2ded6;
    --accent-ink:#fff8f2;
    --shadow-sm:0 2px 8px -4px rgba(38,30,20,0.18);
    --shadow-md:0 14px 34px -16px rgba(38,30,20,0.32);
    --shadow-lg:0 24px 60px -20px rgba(38,30,20,0.38);
    --c-result:#b23a2a;
    --c-result-tint:#f4ddd6;
    --c-direction:#a9702c;
    --c-direction-tint:#f1e2c9;
    --c-potential:#5d7a3d;
    --c-potential-tint:#dfe6cd;
    --c-degree:#2f7f74;
    --c-degree-tint:#d4e7e3;
    --c-manner:#3f5f85;
    --c-manner-tint:#d9e2ee;
    --c-duration:#7a4f80;
    --c-duration-tint:#e5d9e6;
    --c-frequency:#a14a5c;
    --c-frequency-tint:#eeced5;
    --c-idiom:#4a5a8a;
    --c-idiom-tint:#dde1ef;
    --c-vv:#8a6a2a;
    --c-vv-tint:#ece0c4;
    --focus:#8a2c1f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-0:#1b1712;
      --bg-1:#211c16;
      --surface:#2a231c;
      --surface-2:#332b22;
      --ink:#f3ead9;
      --ink-soft:#c9bba4;
      --ink-faint:#8e8272;
      --line:rgba(243,234,217,0.14);
      --accent:#e2725a;
      --accent-deep:#f08a73;
      --accent-tint:#4a2c23;
      --accent-ink:#241109;
      --shadow-sm:0 2px 10px -4px rgba(0,0,0,0.5);
      --shadow-md:0 16px 36px -16px rgba(0,0,0,0.6);
      --shadow-lg:0 26px 64px -20px rgba(0,0,0,0.65);
      --c-result:#e2725a; --c-result-tint:#442621;
      --c-direction:#d9a24f; --c-direction-tint:#41331d;
      --c-potential:#9db572; --c-potential-tint:#333a24;
      --c-degree:#68bcae; --c-degree-tint:#1f3b37;
      --c-manner:#8fabd6; --c-manner-tint:#28344a;
      --c-duration:#c398c8; --c-duration-tint:#3a2c3e;
      --c-frequency:#d78b98; --c-frequency-tint:#402831;
      --c-idiom:#93a3d6; --c-idiom-tint:#313a56;
      --c-vv:#d1ab5c; --c-vv-tint:#3c331d;
      --focus:#f08a73;
    }
  }
  :root[data-theme="dark"]{
    --bg-0:#1b1712;
    --bg-1:#211c16;
    --surface:#2a231c;
    --surface-2:#332b22;
    --ink:#f3ead9;
    --ink-soft:#c9bba4;
    --ink-faint:#8e8272;
    --line:rgba(243,234,217,0.14);
    --accent:#e2725a;
    --accent-deep:#f08a73;
    --accent-tint:#4a2c23;
    --accent-ink:#241109;
    --shadow-sm:0 2px 10px -4px rgba(0,0,0,0.5);
    --shadow-md:0 16px 36px -16px rgba(0,0,0,0.6);
    --shadow-lg:0 26px 64px -20px rgba(0,0,0,0.65);
    --c-result:#e2725a; --c-result-tint:#442621;
    --c-direction:#d9a24f; --c-direction-tint:#41331d;
    --c-potential:#9db572; --c-potential-tint:#333a24;
    --c-degree:#68bcae; --c-degree-tint:#1f3b37;
    --c-manner:#8fabd6; --c-manner-tint:#28344a;
    --c-duration:#c398c8; --c-duration-tint:#3a2c3e;
    --c-frequency:#d78b98; --c-frequency-tint:#402831;
    --c-idiom:#93a3d6; --c-idiom-tint:#313a56;
    --c-vv:#d1ab5c; --c-vv-tint:#3c331d;
    --focus:#f08a73;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-1), var(--bg-0));
    color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .zh-simp{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;}
  body.script-simp{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:32px 20px 20px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .pinyin{
    font-family:'Noto Serif TC', serif;
    font-style:italic;
    font-weight:500;
  }
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
    min-height:68px;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .nav-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:transparent;border:1.5px solid var(--line);
    color:var(--ink-soft);
    border-radius:999px;
    padding:14px 28px 14px 22px;
    font-size:27px;font-weight:500;
    cursor:pointer;white-space:nowrap;
    transition:border-color .15s, color .15s, background .15s;
  }
  .nav-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
  .crumb{
    font-size:26px;color:var(--ink-faint);font-weight:500;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .crumb b{color:var(--ink-soft);font-weight:700;}
  .script-toggle{
    display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
    border-radius:999px;padding:6px;gap:4px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.05);
  }
  .script-toggle button{
    border:none;background:transparent;color:var(--ink-soft);
    font-size:25px;font-weight:700;padding:12px 24px;border-radius:999px;cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .script-toggle button.active{background:var(--accent);color:var(--accent-ink);}

  main{flex:1;display:flex;flex-direction:column;}

  /* ---------- hero (lang pick) ---------- */
  .hero{
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    padding:38px 8px 10px;
    gap:6px;
  }
  .mark{
    width:152px;height:152px;border-radius:44px;
    background:linear-gradient(155deg, var(--accent), var(--accent-deep));
    color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
    font-size:76px;font-weight:900;
    box-shadow:var(--shadow-md);
    margin-bottom:14px;
  }
  h1.title{
    font-size:68px;margin:0;font-weight:900;letter-spacing:.01em;
    text-wrap:balance;
  }
  p.subtitle{
    margin:4px 0 0;color:var(--ink-soft);font-size:30px;line-height:1.7;
    max-width:34em;text-wrap:balance;
  }
  p.subtitle.small{font-size:27px;color:var(--ink-faint);margin-top:2px;}

  .choice-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    width:100%;max-width:420px;margin:26px auto 0;
  }
  .choice-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 14px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .choice-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent);}
  .choice-card .big{font-size:44px;font-weight:900;color:var(--ink);}
  .choice-card .cap{display:block;font-size:23px;color:var(--ink-faint);margin-top:5px;letter-spacing:.06em;}

  /* ---------- module grid ---------- */
  .section-head{text-align:center;margin:6px 0 22px;}
  .section-head h2{font-size:44px;margin:0 0 4px;font-weight:900;}
  .section-head p{margin:0;color:var(--ink-soft);font-size:28px;}

  .module-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    max-width:640px;margin:0 auto;width:100%;
  }
  .module-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 18px;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    text-align:left;
  }
  .module-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent);}
  .module-card .num{
    font-family:'Noto Serif TC',serif;font-style:italic;font-weight:600;
    font-size:25px;color:var(--accent);letter-spacing:.04em;
  }
  .module-card h3{margin:6px 0 4px;font-size:38px;font-weight:900;}
  .module-card p{margin:0;font-size:25px;color:var(--ink-faint);line-height:1.5;}
  .module-card.soon{cursor:default;opacity:.55;}
  .module-card.soon:hover{transform:none;box-shadow:var(--shadow-sm);border-color:var(--line);}
  .badge-soon{
    position:absolute;top:16px;right:16px;
    font-size:21px;font-weight:700;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:999px;padding:6px 18px;
    background:var(--surface-2);
  }

  /* ---------- type grid ---------- */
  .type-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:13px;
  }
  .type-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-left:6px solid var(--cat-color, var(--accent));
    border-radius:16px;
    padding:18px 16px;
    text-align:left;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .type-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .type-card h3{margin:0 0 5px;font-size:34px;font-weight:900;}
  .type-card p{margin:0 0 10px;font-size:25px;color:var(--ink-soft);line-height:1.55;min-height:2.4em;}
  .type-card .count{
    font-size:22px;font-weight:700;color:var(--cat-color, var(--accent));
    background:var(--cat-tint, var(--accent-tint));
    display:inline-block;padding:6px 18px;border-radius:999px;
  }

  /* ---------- deck ---------- */
  .deck-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:18px;flex-wrap:wrap;
  }
  .cat-pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:26px;font-weight:700;color:var(--cat-color);
    background:var(--cat-tint);
    padding:12px 26px;border-radius:999px;
  }
  .cat-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cat-color);}
  .progress-wrap{
    display:flex;align-items:center;gap:9px;font-size:25px;color:var(--ink-faint);font-weight:600;
  }
  .progress-track{
    width:110px;height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-fill{height:100%;background:var(--cat-color, var(--accent));border-radius:999px;transition:width .25s ease;}

  .deck-body{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px 0 18px;
  }
  .card-stage{
    width:100%;max-width:440px;
    perspective:1400px;
  }
  .flip-card{
    position:relative;width:100%;
    cursor:pointer;
  }
  .flip-inner{
    display:grid;
    transition:transform .5s cubic-bezier(.22,.8,.32,1.1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .face{
    grid-area:1/1;
    align-self:start;
    width:100%;
    border-radius:24px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:26px;
    box-shadow:var(--shadow-lg);
    border:1px solid var(--line);
    box-sizing:border-box;
  }
  .face-front{
    background:var(--surface);
    border-top:8px solid var(--cat-color, var(--accent));
    aspect-ratio:4/3;
  }
  .face-front .hanzi{
    font-size:clamp(52px,13vw,86px);
    font-weight:900;
    letter-spacing:.02em;
    text-align:center;
    line-height:1.15;
  }
  .face-back{
    background:var(--surface-2);
    transform:rotateY(180deg);
    justify-content:flex-start;
    padding-top:22px;
    min-height:100%;
  }
  .back-hanzi{font-size:52px;font-weight:900;}
  .back-pinyin{font-size:30px;color:var(--cat-color);margin-top:2px;margin-bottom:14px;}
  .back-lines{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;}
  .back-line{font-size:27px;line-height:1.65;text-align:left;}
  .back-line .lbl{font-weight:700;color:var(--cat-color);}
  .back-line .val{color:var(--ink);}
  .back-line.example .val{color:var(--ink-soft);}
  .tap-hint{
    margin-top:16px;font-size:23px;color:var(--ink-faint);
    letter-spacing:.04em;
  }

  .deck-controls{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-top:22px;width:100%;max-width:440px;
  }
  .ctl-btn{
    width:88px;height:88px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);font-size:36px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:var(--shadow-sm);
    transition:background .15s, color .15s, transform .1s;
  }
  .ctl-btn:hover{color:var(--accent);border-color:var(--accent);}
  .ctl-btn:active{transform:scale(.94);}
  .ctl-btn:disabled{opacity:.35;cursor:default;}
  .ctl-btn:disabled:hover{color:var(--ink-soft);border-color:var(--line);}
  .flip-btn{
    flex:1;max-width:260px;
    height:88px;border-radius:999px;
    background:var(--cat-color, var(--accent));color:var(--accent-ink);
    border:none;font-weight:700;font-size:28px;cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .1s;
  }
  .flip-btn:active{transform:scale(.97);}

  .deck-foot-row{
    display:flex;justify-content:center;margin-top:14px;
  }
  .ghost-btn{
    background:transparent;border:none;color:var(--ink-faint);
    font-size:25px;font-weight:600;cursor:pointer;padding:6px 10px;
    text-decoration:underline;text-underline-offset:3px;
  }
  .ghost-btn:hover{color:var(--accent);}

  .intro-note{
    max-width:440px;margin:0 auto 20px;text-align:center;
    font-size:26px;color:var(--ink-soft);line-height:1.7;
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px 18px;
  }

  .done-panel{
    text-align:center;max-width:380px;margin:0 auto;
  }
  .done-panel .emoji-mark{
    width:120px;height:120px;border-radius:50%;margin:0 auto 14px;
    background:var(--cat-tint);color:var(--cat-color);
    display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;
  }
  .done-panel h3{font-size:38px;margin:0 0 6px;}
  .done-panel p{font-size:27px;color:var(--ink-soft);margin:0 0 18px;}
  .done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .pill-btn{
    border-radius:999px;padding:20px 36px;font-size:27px;font-weight:700;cursor:pointer;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);
  }
  .pill-btn.primary{background:var(--cat-color, var(--accent));color:var(--accent-ink);border:none;}

  footer.site-foot{
    text-align:center;color:var(--ink-faint);font-size:23px;
    padding:26px 0 6px;letter-spacing:.02em;
  }

  @media (max-width:520px){
    .wrap{padding:20px 14px 14px;}
    h1.title{font-size:56px;}
    .module-grid{grid-template-columns:1fr;}
    .choice-grid{grid-template-columns:1fr 1fr;}
    .deck-controls{gap:10px;}
    .topbar{flex-wrap:wrap;row-gap:10px;min-height:0;}
    .nav-btn{font-size:19px;padding:9px 18px 9px 14px;}
    .crumb{font-size:18px;}
    .script-toggle button{font-size:17px;padding:8px 14px;}
    .topbar-left{gap:8px;}
  }

  /* ---------- practice ---------- */
  .quiz-shell{max-width:600px;margin:0 auto;width:100%;}
  .quiz-passage{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;margin-bottom:18px;font-size:14.5px;line-height:1.85;color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .quiz-item{margin-bottom:22px;}
  .quiz-item:last-child{margin-bottom:0;}
  .quiz-item .q-prompt{
    font-size:30px;font-weight:700;margin-bottom:10px;line-height:1.5;
    display:flex;gap:8px;
  }
  .quiz-item .q-prompt .q-label{
    flex:none;color:var(--accent);font-family:'Noto Serif TC',serif;font-weight:700;
  }
  .opt-list{display:flex;flex-direction:column;gap:8px;}
  .opt-btn{
    text-align:left;
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1.5px solid var(--line);
    border-radius:12px;padding:20px 26px;
    font-size:28px;color:var(--ink);cursor:pointer;
    font-family:inherit;
    transition:border-color .15s,background .15s;
  }
  .opt-btn .opt-mark{
    flex:none;width:44px;height:44px;border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:700;color:var(--ink-faint);
  }
  .opt-btn:hover{border-color:var(--accent);}
  .opt-btn.selected{border-color:var(--accent);background:var(--accent-tint);}
  .opt-btn.selected .opt-mark{border-color:var(--accent);color:var(--accent);background:var(--surface);}
  .opt-btn.is-correct{border-color:#4c8a5e;background:rgba(76,138,94,0.12);}
  .opt-btn.is-correct .opt-mark{border-color:#4c8a5e;color:#4c8a5e;background:var(--surface);}
  .opt-btn.is-wrong{border-color:var(--accent);background:rgba(178,58,42,0.1);}
  .opt-btn.is-wrong .opt-mark{border-color:var(--accent);color:var(--accent);background:var(--surface);}
  .opt-btn:disabled{cursor:default;}
  .opt-btn:disabled:hover{border-color:var(--line);}
  .opt-btn.selected:disabled:hover{border-color:var(--accent);}

  .quiz-headrow{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:16px;flex-wrap:wrap;
  }
  .quiz-actions{
    display:flex;justify-content:center;gap:12px;margin-top:24px;
  }
  .quiz-actions .pill-btn{min-width:140px;}

  .score-ring{
    width:192px;height:192px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    margin:0 auto 16px;
    background:var(--accent-tint);color:var(--accent);
    font-weight:900;font-size:52px;line-height:1;
    border:4px solid var(--accent);
  }
  .score-ring small{font-size:22px;font-weight:700;margin-top:3px;color:var(--ink-faint);}
  .review-list{
    text-align:left;max-width:520px;margin:22px auto 0;
    display:flex;flex-direction:column;gap:10px;
  }
  .review-item{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:20px 26px;font-size:26px;line-height:1.6;
  }
  .review-item .r-q{font-weight:700;color:var(--ink);margin-bottom:4px;}
  .review-item .r-your{color:var(--accent);}
  .review-item .r-correct{color:#4c8a5e;font-weight:700;}
  .review-head{
    text-align:center;font-size:26px;font-weight:700;color:var(--ink-faint);
    margin:26px 0 4px;letter-spacing:.04em;
  }

  @media (max-width:520px){
    .quiz-passage{padding:14px 16px;font-size:14px;}
  }

  /* ---------- lookup (module 4) ---------- */
  .lookup-search-wrap{max-width:480px;margin:0 auto 22px;}
  .lookup-input{
    width:100%;padding:22px 32px;border-radius:999px;

<script>
(function(){
"use strict";

/* ============ 簡繁字轉換表 ============ */
var S2 = {
  "見":"见","會":"会","對":"对","錯":"错","著":"着","來":"来","進":"进","過":"过","動":"动",
  "極":"极","壞":"坏","兒":"儿","時":"时","補":"补","語":"语","個":"个","聲":"声","頓":"顿",
  "場":"场","學":"学","聽":"听","說":"说","寫":"写","記":"记","準":"准","備":"备","認":"认",
  "堅":"坚","靜":"静","暈":"晕","關":"关","買":"买","氣":"气","興":"兴","熱":"热","讀":"读",
  "罵":"骂","兩":"两","張":"张","開":"开","製":"制","選":"选","擇":"择","隨":"随","亂":"乱",
  "類":"类","詢":"询","頁":"页","簡":"简","習":"习","閱":"阅","慣":"惯","塊":"块","將":"将",
  "點":"点","擊":"击","釋":"释","複":"复","單":"单","機":"机","體":"体","練":"练","繁":"繁",
  "髒":"脏","輕":"轻","紅":"红","鐘":"钟","禮":"礼","輩":"辈","紀":"纪","槍":"枪","腳":"脚",
  "歷":"历","貴":"贵","討":"讨","論":"论","陣":"阵","幾":"几","經":"经","營":"营","識":"识",
  "變":"变"
};
function toS(str){
  if(typeof str!=="string") return str;
  var out="";
  for(var i=0;i<str.length;i++){ var c=str[i]; out += (S2[c]||c); }
  return out;

/* ============ 內容資料 ============ */
var CATEGORIES = [{"id":"result","name":"結果補語","short":"結果","color":"var(--c-result)","tint":"var(--c-result-tint)","tagline":"動作帶來的「結果」","intro":{"zh":"表示動作帶來的結果。","ja":"動作がもたらす「結果」を表します。","en":"Expresses the result an action brings about."},"cards":[{"h":"見","p":"jiàn","ja":{"m":"視覺に入る、知覚する","i":"「看」より一歩進み、目や耳に「カチッと入る」結果を表す"},"en":{"m":"to enter one's sight, to perceive","i":"marks the moment something “clicks” into the eyes or ears — beyond just looking (看)"},"ex":"我在人群中一眼就看見了她。"},{"h":"到","p":"dào","ja":{"m":"到着する、届く","i":"動作が目的地に「到達する」＝目的を果たす"},"en":{"m":"to arrive, to reach","i":"the action “arrives at” its target — goal achieved"},"ex":"我終於在商店裡找到了那本書。"},{"h":"完","p":"wán","ja":{"m":"終わる、無くなる","i":"数量やプロセスが「ゼロになる」＝完了"},"en":{"m":"to end, to run out","i":"the quantity or process hits zero — all done"},"ex":"他很快就把作業寫完了。"},{"h":"好","p":"hǎo","ja":{"m":"良い、仕上がる","i":"終わるだけでなく「満足のいく状態に仕上がる」"},"en":{"m":"good, properly finished","i":"not just done — done well, ready to use"},"ex":"晚飯已經做好了，快來吃吧。"},{"h":"懂","p":"dǒng","ja":{"m":"理解する","i":"情報が頭に入り「わかった状態」になる"},"en":{"m":"to understand","i":"information goes in and “clicks” — comprehension achieved"},"ex":"老師說得很慢，我完全聽懂了。"},{"h":"會","p":"huì","ja":{"m":"できる、身につく","i":"練習の結果、「できる状態」になる"},"en":{"m":"to master, to become able to","i":"practice pays off — the skill is now yours"},"ex":"我花了一個月終於學會了游泳。"},{"h":"對","p":"duì","ja":{"m":"正しい","i":"動作の結果が「正解」になる"},"en":{"m":"correct","i":"the result of the action turns out right"},"ex":"這次考試他全部都答對了。"},{"h":"錯","p":"cuò","ja":{"m":"間違っている","i":"動作の結果が「不正解」になる"},"en":{"m":"wrong","i":"the result of the action turns out wrong"},"ex":"我把他的名字寫錯了。"},{"h":"住","p":"zhù","ja":{"m":"住む、とどまる","i":"動いていたものが「その場に固定される」"},"en":{"m":"to stay, to live","i":"something moving becomes firmly fixed in place"},"ex":"請大家記住這個重要的日期。"},{"h":"著","p":"zháo","ja":{"m":"触れる、火がつく","i":"対象に「ピタッと接触」＝うまく達成する（眠り・火など）"},"en":{"m":"to touch, to catch (as fire)","i":"making contact with the target — goal successfully hit"},"ex":"寶寶哭了很久才終於睡著。"},{"h":"在","p":"zài","ja":{"m":"存在する、〜にある","i":"動作の結果、人や物が「そこに位置する」"},"en":{"m":"to exist, to be located","i":"the result: a person or thing ends up located there"},"ex":"他把書包放在桌子上了。"},{"h":"髒","p":"zāng","ja":{"m":"汚い","i":"動作の結果、物が「汚れた状態になる」"},"en":{"m":"dirty","i":"the result of the action — something becomes dirty"},"ex":"小狗不小心把地毯弄髒了。"},{"h":"碎","p":"suì","ja":{"m":"砕ける、粉々になる","i":"動作の結果、物が「粉々に壊れる」"},"en":{"m":"broken to pieces","i":"the result of the action — something shatters"},"ex":"他不小心把媽媽的花瓶打碎了。"},{"h":"紅","p":"hóng","ja":{"m":"赤い","i":"動作の結果、「赤くなる」（目や顔など）"},"en":{"m":"red","i":"the result of the action — something turns red (eyes, face, etc.)"},"ex":"她因為那部電影哭紅了眼睛。"},{"h":"大","p":"dà","ja":{"m":"大きい","i":"動作の結果、「大きくなる」"},"en":{"m":"big","i":"the result of the action — something becomes bigger"},"ex":"這幾年這座城市變大了很多。"},{"h":"輕","p":"qīng","ja":{"m":"軽い","i":"人や物を「軽く見る」＝見くびる、軽んじる"},"en":{"m":"light (in weight)","i":"to see someone or something as “light” — to underestimate, belittle"},"ex":"你不應該看輕自己的能力。"},{"h":"開","p":"kāi","ja":{"m":"開く","i":"心や状況が「開く」＝こだわりが取れる、または離れて空きができる"},"en":{"m":"to open","i":"the mind or situation “opens up” — letting go of something, or freeing up space"},"ex":"他終於想開了，心情好多了。"},{"h":"成","p":"chéng","ja":{"m":"成る、できあがる","i":"動作の結果、別のものに「変わる」"},"en":{"m":"to become","i":"the result of the action — turning into something else"},"ex":"毛毛蟲最後會變成美麗的蝴蝶。"},{"h":"清","p":"qīng","ja":{"m":"はっきりしている","i":"動作の結果、「はっきり見える／わかる」状態になる"},"en":{"m":"clear","i":"the result of the action — becoming clearly visible or understandable"},"ex":"燈光太暗，我看不清黑板上的字。"},{"h":"倒","p":"dǎo","ja":{"m":"倒れる","i":"動作の結果、物が「倒れる」"},"en":{"m":"to fall over","i":"the result of the action — something topples over"},"ex":"昨晚的颱風把大樹吹倒了。"},{"h":"滿","p":"mǎn","ja":{"m":"いっぱいである","i":"動作の結果、空間や容器が「いっぱいになる」"},"en":{"m":"full","i":"the result of the action — a space or container becomes full"},"ex":"教室裡的座位已經坐滿了學生。"},{"h":"乾淨","p":"gānjìng","ja":{"m":"きれいである","i":"動作の結果、「きれいな状態」になる"},"en":{"m":"clean","i":"the result of the action — something becomes clean"},"ex":"媽媽把桌子擦乾淨了。"},{"h":"醒","p":"xǐng","ja":{"m":"目が覚める","i":"動作の結果、眠りから「覚める」"},"en":{"m":"to wake up","i":"the result of the action — waking from sleep"},"ex":"鬧鐘的聲音把我吵醒了。"},{"h":"熟","p":"shú","ja":{"m":"よく熟れている、習熟している","i":"動作の結果、「よく火が通る」または「よく身につく」状態になる"},"en":{"m":"well-cooked, familiar","i":"the result of the action — thoroughly cooked, or thoroughly learned"},"ex":"這些青菜還沒炒熟，再等一下。"}]},{"id":"direction","name":"趨向補語","short":"趨向","color":"var(--c-direction)","tint":"var(--c-direction-tint)","tagline":"動作的「方向」","intro":{"zh":"表示動作朝向某個方向發展，分為簡單和複合兩種。","ja":"動作が向かう「方向」を表します。単純と複合の2種類があります。","en":"Expresses the direction an action moves in — simple or compound."},"cards":[{"h":"來","p":"lái","ja":{"m":"話し手に近づく","i":"動作が「こちら」へ向かう"},"en":{"m":"toward the speaker","i":"the action moves “this way”"},"ex":"爸爸下班以後就馬上回來了。"},{"h":"去","p":"qù","ja":{"m":"話し手から離れる","i":"動作が「あちら」へ向かう"},"en":{"m":"away from the speaker","i":"the action moves “that way”"},"ex":"現在很晚了，我該回去了。"},{"h":"上","p":"shàng","ja":{"m":"下から上へ上がる","i":"上へ向かう、または「ピタッとくっつく／閉じる」"},"en":{"m":"upward","i":"moving up — or sticking / closing onto something"},"ex":"他很快就爬上山頂了。"},{"h":"下","p":"xià","ja":{"m":"上から下へ下りる","i":"下へ向かう、または「収まる」"},"en":{"m":"downward","i":"moving down — or settling into place"},"ex":"請大家先坐下，我們開始上課。"},{"h":"進","p":"jìn","ja":{"m":"外から中へ入る","i":"内側へ向かう"},"en":{"m":"inward","i":"moving into a space"},"ex":"他慢慢走進教室，找位子坐下。"},{"h":"出","p":"chū","ja":{"m":"中から外へ出る","i":"外側へ向かう"},"en":{"m":"outward","i":"moving out of a space"},"ex":"他從包包裡拿出一本書。"},{"h":"回","p":"huí","ja":{"m":"元の場所へ戻る","i":"出発点へ向かう"},"en":{"m":"back, returning","i":"heading back to where it started"},"ex":"他出差回來，帶回了很多禮物給大家。"},{"h":"過","p":"guò","ja":{"m":"通り過ぎる","i":"ある地点を通ってこちら／あちらへ"},"en":{"m":"across, over, past","i":"passing by a point, toward here or there"},"ex":"我們每天都走過這座橋去上班。"},{"h":"起","p":"qǐ","ja":{"m":"下から上へ持ち上がる","i":"動作が上向きに始まる"},"en":{"m":"upward, rising","i":"the action lifts upward / begins"},"ex":"他彎下腰，拿起地上的書。"},{"h":"起來","p":"qǐlái","ja":{"m":"起き上がる、立ち上がる","i":"①【開始】〜し始める（笑起來）②【想起】記憶が浮かぶ（想起來）"},"en":{"m":"to get up, to rise","i":"① start ~ing (笑起來) ② a memory surfaces (想起來)"},"ex":"他忽然想起來這件事，笑了起來。"},{"h":"出來","p":"chūlái","ja":{"m":"中から外へ出てくる","i":"①【出現】隱れていたものが現れる（看出來）②【創造】無から有を生む（做出來）"},"en":{"m":"to come out","i":"① something hidden comes to light (看出來) ② creating something new (做出來)"},"ex":"他馬上就看出來問題，很快做出來新設計。"},{"h":"下去","p":"xiàqù","ja":{"m":"下りていく","i":"【継続】そのまま〜し続ける"},"en":{"m":"to go down","i":"continuing on, just as it is"},"ex":"不管多辛苦，我都要堅持下去。"},{"h":"下來","p":"xiàlái","ja":{"m":"下りてくる","i":"①【固定】動きを止めて書き留める（記下來）②【落ち着く】激しさが静まる（靜下來）"},"en":{"m":"to come down","i":"① settle or write it down (記下來) ② calm down from intensity (靜下來)"},"ex":"老師說的重點我都趕快記下來，心情也慢慢靜下來了。"},{"h":"過來","p":"guòlái","ja":{"m":"通ってこちらへ来る","i":"【正常化】異常な状態から正常に戻る"},"en":{"m":"to come over","i":"returning to a normal state"},"ex":"他昏倒之後，過了幾分鐘才醒過來。"},{"h":"過去","p":"guòqù","ja":{"m":"通ってあちらへ行く","i":"【非正常化】正常な状態から非日常な状態へ"},"en":{"m":"to go over","i":"slipping out of a normal state"},"ex":"她聽到消息太震驚，當場暈過去了。"},{"h":"上去","p":"shàngqù","ja":{"m":"上がっていく","i":"【付着・閉鎖】上にくっつく、閉じて密着する"},"en":{"m":"to go up (onto)","i":"attaching on top, closing something shut"},"ex":"他小心地把海報貼上去。"}]},{"id":"potential","name":"可能補語","short":"可能","color":"var(--c-potential)","tint":"var(--c-potential-tint)","tagline":"「能不能」做到","intro":{"zh":"在動詞與結果／趨向補語中間加上「得」或「不」，表示做不做得到。以下是幾個較特別的可能補語用字。","ja":"動詞と結果／方向補語の間に「得」（できる）か「不」（できない）を挟んで、可能かどうかを表します。以下はやや特殊な可能補語の字です。","en":"Insert 得 (can) or 不 (cannot) between the verb and a resultative/directional complement. Below are a few special potential-complement words."},"cards":[{"h":"動","p":"dòng","ja":{"m":"動く","i":"体力があって「物理的に動かせるか」"},"en":{"m":"to move","i":"whether you have the strength to physically move it"},"ex":"走了一整天，我現在走不動了。"},{"h":"了","p":"liǎo","ja":{"m":"終わる、完了する（liǎoと読む、leではない）","i":"状況的に「最後までやり切れるか」"},"en":{"m":"to finish, to manage (read liǎo, not le)","i":"whether circumstances let you see it through"},"ex":"明天要是下雨，我們可能去不了了。"},{"h":"下","p":"xià","ja":{"m":"収める","i":"空間の余裕が「収まるかどうか」"},"en":{"m":"to fit","i":"whether there's room for it to fit"},"ex":"這張桌子太小，坐不下十個人。"},{"h":"起","p":"qǐ","ja":{"m":"持ち上げる","i":"経済力・身分が「支えられるか」"},"en":{"m":"to lift, to afford","i":"whether you can afford to carry the weight"},"ex":"這間房子太貴，我買不起。"},{"h":"中","p":"zhòng","ja":{"m":"当たる、命中する","i":"見て「気に入る、好みに当たる」かどうか"},"en":{"m":"to hit, to match","i":"whether something “hits the mark” of one's taste — to take a liking to"},"ex":"我在店裡看中了一件紅色的外套。"},{"h":"消","p":"xiāo","ja":{"m":"消化する、こなす","i":"身体や気持ちが「持ちこたえられるか」"},"en":{"m":"to digest, to bear","i":"whether your body or nerves can hold up under it"},"ex":"每天加班到很晚，我實在吃不消。"}]},{"id":"degree","name":"程度補語","short":"程度","color":"var(--c-degree)","tint":"var(--c-degree-tint)","tagline":"程度有多「深」","intro":{"zh":"表示動作或狀態達到的程度，常搭配「極、死、壞、透」等字。","ja":"動作や状態が達した「程度」を表します。「極・死・壊・透」などとよく組み合わせます。","en":"Expresses the degree an action or state reaches, often with words like 極/死/壞/透."},"cards":[{"h":"極","p":"jí","ja":{"m":"北極・南極、頂点","i":"これ以上ない「限界」に達している"},"en":{"m":"the pole, the summit","i":"reaching the absolute limit"},"ex":"這裡的風景美極了！"},{"h":"死","p":"sǐ","ja":{"m":"命がなくなる","i":"耐えがたいほどその状態がひどい"},"en":{"m":"to die","i":"a state so intense it feels life-threatening"},"ex":"今天走了一整天，累死了。"},{"h":"壞","p":"huài","ja":{"m":"壊れる、悪くなる","i":"心や体が「壊れそうなほど」感情が高ぶる"},"en":{"m":"to break, to go bad","i":"emotions so strong the mind or body feels like breaking"},"ex":"看到這個消息，他氣壞了。"},{"h":"透","p":"tòu","ja":{"m":"突き抜ける、染み込む","i":"芯まで100%その状態になりきる"},"en":{"m":"to penetrate through","i":"soaked all the way through — 100% that state"},"ex":"這次考試考得糟糕透了。"},{"h":"得多","p":"dé duō","ja":{"m":"「得」＋「多」","i":"形容詞＋「得多」で比較の差が大きいことを表す＝「ずっと〜」"},"en":{"m":"得 + 多 (more)","i":"adjective + 得多 shows a big gap in comparison — “much more ~”"},"ex":"今天的天氣比昨天冷得多。"},{"h":"多了","p":"duō le","ja":{"m":"「多」＋「了」","i":"形容詞の後に置き、以前より「ずっと〜になった」という変化を表す"},"en":{"m":"多 (more) + 了","i":"placed after an adjective to show a big change compared with before"},"ex":"吃了藥以後，他覺得舒服多了。"},{"h":"一些","p":"yī xiē","ja":{"m":"（数量が）少し","i":"形容詞＋「了」＋「一些」で「少し〜になった」という控えめな比較"},"en":{"m":"a bit, a little","i":"a softer comparison — “a bit more ~ than before”"},"ex":"這件衣服比那件貴了一些。"}]},{"id":"manner","name":"樣態補語（得）","short":"樣態","color":"var(--c-manner)","tint":"var(--c-manner-tint)","tagline":"動作的「樣子」","intro":{"zh":"用「得」連接動詞和描述語，說明動作進行的樣子。","ja":"「得」で動詞と描写語をつなぎ、動作の「様子」を説明します。","en":"得 links a verb to a description, showing the manner in which the action happens."},"cards":[{"h":"得","p":"de","ja":{"m":"（結構助詞、もとの意味はなし）","i":"動詞・形容詞の後に置き「〜するのが…だ」と様子を説明する目印"},"en":{"m":"(a structural particle, no original meaning)","i":"a marker placed after a verb / adjective to describe how the action is done"},"ex":"他跑得非常快，是班上最快的。"},{"h":"得很","p":"de hěn","ja":{"m":"形容詞＋「得很」","i":"「とても〜だ」という強調"},"en":{"m":"adjective + 得很","i":"emphasizes “very ~”"},"ex":"這家餐廳的菜好得很，你一定要試試。"},{"h":"不得了","p":"bù dé liǎo","ja":{"m":"収拾がつかない、大変だ","i":"程度が「手に負えないほど」に達している"},"en":{"m":"unmanageable, terribly so","i":"the degree has gone past what you can handle"},"ex":"今天天氣熱得不得了，大家都在流汗。"}]},{"id":"duration","name":"時量補語","short":"時量","color":"var(--c-duration)","tint":"var(--c-duration-tint)","tagline":"動作「多久」","intro":{"zh":"表示動作或狀態持續了多久時間。","ja":"動作や状態が「どれだけ続いたか」という時間の長さを表します。","en":"Expresses how long an action or state lasted."},"cards":[{"h":"一下","p":"yī xià","ja":{"m":"ちょっとの間","i":"動詞の後で「短い時間」を表す"},"en":{"m":"a moment","i":"marks a short span of time after the verb"},"ex":"你等一下，我馬上就來。"},{"h":"一下子","p":"yī xiàzi","ja":{"m":"一瞬で、あっという間に","i":"「一下」よりくだけた言い方で短い時間を表す"},"en":{"m":"in an instant","i":"a casual way to say “in a flash”"},"ex":"別擔心，這件事一下子就能做完。"},{"h":"片刻","p":"piànkè","ja":{"m":"（書き言葉）ほんの一瞬","i":"書面語で「一瞬・少しの間」を表す"},"en":{"m":"(literary) a brief moment","i":"a formal way to say “a moment”"},"ex":"他沉默片刻，才緩緩開口說話。"},{"h":"一會兒","p":"yī huǐr","ja":{"m":"少しの間（口語）","i":"「一下」よりやや口語的な「しばらく」"},"en":{"m":"a little while (colloquial)","i":"a slightly more casual “for a bit”"},"ex":"請你在門口等一會兒，老闆馬上出來。"},{"h":"一分鐘","p":"yī fēnzhōng","ja":{"m":"1分間","i":"具体的な時間の長さ"},"en":{"m":"one minute","i":"a concrete, short length of time"},"ex":"麻煩你再等一分鐘，湯就要好了。"},{"h":"十分鐘","p":"shí fēnzhōng","ja":{"m":"10分間","i":"具体的な時間の長さ"},"en":{"m":"ten minutes","i":"a concrete length of time"},"ex":"我們先休息十分鐘，再繼續開會。"},{"h":"半個小時","p":"bàn ge xiǎoshí","ja":{"m":"30分","i":"「一個小時」の半分の長さ"},"en":{"m":"half an hour","i":"half the length of one hour"},"ex":"我在車站等了半個小時，公車才來。"},{"h":"一學時","p":"yī xuéshí","ja":{"m":"1コマ（授業時間）","i":"授業1コマ分の長さ（約45〜50分）"},"en":{"m":"one class period","i":"the length of one class period (about 45–50 min)"},"ex":"今天下午我們只上一學時的課。"},{"h":"一鐘頭","p":"yī zhōngtóu","ja":{"m":"1時間（口語）","i":"「一個小時」の口語的な言い方"},"en":{"m":"one hour (colloquial)","i":"a casual way to say “one hour”"},"ex":"他在醫院等了一鐘頭才看到醫生。"},{"h":"一個小時","p":"yī ge xiǎoshí","ja":{"m":"1時間","i":"具体的な長さをそのまま動詞の後に置く"},"en":{"m":"one hour","i":"a concrete length of time placed right after the verb"},"ex":"我排隊排了一個小時才買到票。"},{"h":"半天","p":"bàn tiān","ja":{"m":"半日","i":"転じて「かなり長い時間」の比喩にも使う"},"en":{"m":"half a day","i":"often stretched to mean “a long while”"},"ex":"這個問題他想了半天，還是想不出答案。"},{"h":"一天一夜","p":"yī tiān yī yè","ja":{"m":"まる一昼夜","i":"昼も夜も休まず「まる一日」続く"},"en":{"m":"a full day and night","i":"continuing nonstop through day and night"},"ex":"這場颱風下了一天一夜的雨。"},{"h":"好幾天","p":"hǎo jǐ tiān","ja":{"m":"何日も","i":"はっきりしないが「かなり多くの日数」を表す"},"en":{"m":"quite a few days","i":"an unspecified but sizable number of days"},"ex":"她感冒病了好幾天，一直沒去上班。"},{"h":"一整天","p":"yī zhěng tiān","ja":{"m":"丸一日","i":"動作・状態が一日中続いたことを表す"},"en":{"m":"a whole day","i":"the action or state lasted all day long"},"ex":"我今天在廚房忙了一整天，累死了。"},{"h":"一禮拜","p":"yī lǐbài","ja":{"m":"1週間（口語）","i":"「一個星期」の口語的な言い方"},"en":{"m":"one week (colloquial)","i":"a casual way to say “one week”"},"ex":"醫生叫我在家休息一禮拜。"},{"h":"一個星期","p":"yī ge xīngqí","ja":{"m":"1週間","i":"継続した期間の長さを表す"},"en":{"m":"one week","i":"marks a stretch of one week"},"ex":"我們在台南住了一個星期才回家。"},{"h":"半個月","p":"bàn ge yuè","ja":{"m":"半月（約2週間）","i":"1ヶ月の半分の長さ"},"en":{"m":"half a month","i":"about two weeks"},"ex":"姐姐去日本旅行，住了半個月才回來。"},{"h":"一個月","p":"yī ge yuè","ja":{"m":"1ヶ月","i":"継続した期間の長さを表す"},"en":{"m":"one month","i":"marks a stretch of one month"},"ex":"我學了一個月的中文，進步很多。"},{"h":"數月","p":"shù yuè","ja":{"m":"（書き言葉）数ヶ月","i":"書面語で「何ヶ月も」を表す"},"en":{"m":"(literary) several months","i":"a formal way to say “several months”"},"ex":"這項工程歷時數月才終於完工。"},{"h":"一季度","p":"yī jìdù","ja":{"m":"1四半期（3ヶ月）","i":"ビジネスなどで使う3ヶ月の単位"},"en":{"m":"one quarter","i":"a three-month business period"},"ex":"這家公司已經營運了一季度，成效逐漸顯現。"},{"h":"半輩子","p":"bàn bèizi","ja":{"m":"人生の半分","i":"人生のおよそ半分の長さの時間"},"en":{"m":"half a lifetime","i":"roughly half of one's life"},"ex":"父親為這個家辛苦了半輩子。"},{"h":"半年","p":"bàn nián","ja":{"m":"半年","i":"1年の半分の長さ"},"en":{"m":"half a year","i":"half the length of one year"},"ex":"我學了半年鋼琴，已經會彈幾首曲子。"},{"h":"一年","p":"yī nián","ja":{"m":"1年","i":"継続した期間の長さを表す"},"en":{"m":"one year","i":"marks a stretch of one year"},"ex":"他在台北住了一年，很喜歡這座城市。"},{"h":"一年半","p":"yī nián bàn","ja":{"m":"1年半","i":"語順に注意：一・年・半の順"},"en":{"m":"a year and a half","i":"note the word order: one · year · half"},"ex":"我學了一年半日文，已經能簡單對話。"},{"h":"好幾年","p":"hǎo jǐ nián","ja":{"m":"何年も","i":"はっきりしないが「かなり多くの年数」"},"en":{"m":"quite a few years","i":"an unspecified but sizable number of years"},"ex":"這對老朋友分開好幾年，終於再見面。"},{"h":"十來年","p":"shí lái nián","ja":{"m":"10年あまり","i":"10年よりやや多い、おおよその年数"},"en":{"m":"about ten years","i":"roughly ten-plus years"},"ex":"我和他認識十來年了，感情一直很好。"},{"h":"一世代","p":"yī shìdài","ja":{"m":"ひと世代","i":"人の一世代分の長さの時間（数十年にも使う）"},"en":{"m":"one generation","i":"the span of one generation (also used for “decades”)"},"ex":"這個家族的事業已經傳承了一世代。"},{"h":"半個世紀","p":"bàn ge shìjì","ja":{"m":"半世紀（50年）","i":"100年の半分の長さ"},"en":{"m":"half a century","i":"fifty years"},"ex":"這家老店已經經營了半個世紀。"},{"h":"有生之年","p":"yǒushēngzhīnián","ja":{"m":"（書き言葉）生きている限り","i":"人生の終わりまで続く、非常に長い時間"},"en":{"m":"(literary) as long as one lives","i":"an extremely long span, lasting to the end of one's life"},"ex":"他希望能在有生之年看到孩子結婚。"}]},{"id":"frequency","name":"動量補語","short":"動量","color":"var(--c-frequency)","tint":"var(--c-frequency-tint)","tagline":"做了「幾次」","intro":{"zh":"表示動作進行了幾次。","ja":"動作が「何回」行われたかを表します。","en":"Expresses how many times an action occurred."},"cards":[{"h":"次","p":"cì","ja":{"m":"回、順序","i":"最も一般的な「〜回」"},"en":{"m":"time(s), occurrence","i":"the all-purpose word for “~ times”"},"ex":"我去過北京兩次，很喜歡那裡的烤鴨。"},{"h":"遍","p":"biàn","ja":{"m":"通して1回","i":"始めから終わりまで通して行う1回"},"en":{"m":"once through","i":"one complete pass, start to finish"},"ex":"這篇課文太難了，我看了三遍才看懂。"},{"h":"回","p":"huí","ja":{"m":"回（口語）","i":"「次」とほぼ同じ、エピソード性のある1回"},"en":{"m":"time(s) (colloquial)","i":"like 次, but with more of a story / episode feel"},"ex":"那家餐廳很有名，我們去過一回，味道還不錯。"},{"h":"番","p":"fān","ja":{"m":"ひとしきりのプロセス","i":"思考・努力・議論など、労力を伴う一連の過程を1回と数える"},"en":{"m":"a round, a process","i":"counts a whole process involving effort — thinking, debating, working hard"},"ex":"為了這個決定，我們認真討論了一番。"},{"h":"遭","p":"zāo","ja":{"m":"（人生の）1回、巡り合わせ","i":"人生の一度きりの経験・巡り合わせを1回と数える、文語的"},"en":{"m":"a turn, a time (in life)","i":"a literary way to count a once-in-a-lifetime experience"},"ex":"聽說那座山很美，他特地去走了一遭。"},{"h":"下","p":"xià","ja":{"m":"軽く1回","i":"軽い・短い動作の1回"},"en":{"m":"a light action, once","i":"one quick, light action"},"ex":"他看我在發呆，就輕輕拍了我一下。"},{"h":"巴掌","p":"bāzhang","ja":{"m":"平手打ち1発","i":"手のひらで打つ動作の1回"},"en":{"m":"a slap","i":"one strike with the palm of the hand"},"ex":"電影裡，壞人欺負小孩，被英雄打了一巴掌。"},{"h":"拳","p":"quán","ja":{"m":"拳（パンチ）1発","i":"こぶしで打つ動作の1回"},"en":{"m":"a punch","i":"one strike with a fist"},"ex":"漫畫裡，主角生氣地打了敵人一拳，把他打退。"},{"h":"槍","p":"qiāng","ja":{"m":"銃撃1発","i":"銃で撃つ動作の1回"},"en":{"m":"a gunshot","i":"one shot fired"},"ex":"警匪片裡，警察對空開了一槍，把小偷嚇跑了。"},{"h":"刀","p":"d
